name: Deploy v6

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Download updated HTML
        run: |
          curl -L -o index.html "https://d08bcfa2-88b9-4967-9ea4-43335e3750eb.usrfiles.com/ugd/345002_6b07f7da54e0415fa57819db12cd3663.txt"
          echo "Downloaded $(wc -c < index.html) bytes"

      - name: Commit and push
        run: |
          git config user.email "blowerbuildz@gmail.com"
          git config user.name "BlowerBuildz Deploy"
          git add index.html
          git diff --staged --stat
          git commit -m "BlowerBuildz v9: sedan/SUV bodies, wheel widths + deep dish, white-letter tires, pop sunroof, body-kit previews" || echo "Nothing to commit"
          git push
