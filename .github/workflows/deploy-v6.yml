name: Deploy v6

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Download updated HTML
        run: |
          curl -L -o index.html "https://d08bcfa2-88b9-4967-9ea4-43335e3750eb.usrfiles.com/ugd/345002_31757efa03cc40779856fb38222e408e.txt"
          echo "Downloaded $(wc -c < index.html) bytes"

      - name: Commit and push
        run: |
          git config user.email "blowerbuildz@gmail.com"
          git config user.name "BlowerBuildz Deploy"
          git add index.html
          git diff --staged --stat
          git commit -m "Add Summit Racing + JEGS affiliate fallbacks (25 parts swapped)" || echo "Nothing to commit"
          git push
