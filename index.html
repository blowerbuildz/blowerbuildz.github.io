<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name='impact-site-verification' value='cc214b1f-31f1-433f-94a0-ec193a25801b'>
<title>BlowerBuildz - 3D Configurator</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r134/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.134.0/examples/js/loaders/GLTFLoader.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.134.0/examples/js/loaders/DRACOLoader.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@400;600;700&family=JetBrains+Mono:wght@400;500;700&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#0A0A0C;--bg2:#0f0f12;--bg3:#141418;
  --red:#E8472A;--red2:#c73a20;
  --amber:#F2A900;--amber2:#d4930a;
  --white:#f0f0f0;--dim:rgba(240,240,240,.55);--dim2:rgba(240,240,240,.28);
  --glass:rgba(255,255,255,.04);--glass2:rgba(255,255,255,.08);
  --border:rgba(255,255,255,.08);
  --glow-r:0 0 20px rgba(232,71,42,.4);--glow-a:0 0 18px rgba(242,169,0,.4);
  --fh:'Rajdhani',sans-serif;--fm:'JetBrains Mono',monospace;--fb:'Inter',sans-serif;
}
html,body{height:100%;overflow:hidden;background:var(--bg);color:var(--white);font-family:var(--fb)}

/* HERO */
#hero{position:fixed;inset:0;z-index:1000;display:flex;flex-direction:column;align-items:center;justify-content:center;background:#000;transition:opacity .65s,visibility .65s}
#hero.out{opacity:0;visibility:hidden;pointer-events:none}
#hbg{position:absolute;inset:0;background:url('https://static.wixstatic.com/media/345002_78cd89fa1fda4f4093999207fcb1d260~mv2.jpg') center/cover no-repeat;filter:brightness(.42) saturate(1.2)}
#hov{position:absolute;inset:0;background:rgba(0,0,0,.4)}
.hc{position:relative;z-index:2;text-align:center;max-width:800px;padding:24px}
.hlogo{font-family:var(--fh);font-size:clamp(2.8rem,7vw,5.4rem);font-weight:700;letter-spacing:.08em;color:var(--white);text-shadow:0 0 40px rgba(232,71,42,.7);margin-bottom:4px}
.hlogo b{color:var(--red)}
.htag{font-family:var(--fm);font-size:.88rem;color:var(--amber);letter-spacing:.3em;text-transform:uppercase;margin-bottom:32px}
.hchips{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin-bottom:40px}
.hchip{font-family:var(--fm);font-size:.7rem;letter-spacing:.15em;color:var(--dim);border:1px solid var(--border);padding:5px 14px;border-radius:3px}
.hcta{font-family:var(--fh);font-size:1.05rem;font-weight:700;letter-spacing:.12em;text-transform:uppercase;background:var(--red);color:#fff;border:none;padding:16px 52px;border-radius:4px;cursor:pointer;box-shadow:var(--glow-r);transition:all .2s}
.hcta:hover{background:var(--red2);transform:translateY(-2px);box-shadow:0 0 36px rgba(232,71,42,.65)}
.smoke{position:absolute;border-radius:50%;filter:blur(90px);animation:hdrift linear infinite;pointer-events:none}
@keyframes hdrift{0%{transform:translate(0,0) scale(1);opacity:.18}33%{transform:translate(30px,-25px) scale(1.1);opacity:.26}66%{transform:translate(-20px,18px) scale(.9);opacity:.14}100%{transform:translate(0,0) scale(1);opacity:.18}}

/* APP SHELL */
#app{position:fixed;inset:0;display:flex;flex-direction:column;opacity:0;transition:opacity .55s}
#app.vis{opacity:1}

/* HEADER */
#hdr{height:50px;background:rgba(10,10,12,.97);border-bottom:1px solid var(--border);display:flex;align-items:center;padding:0 14px;gap:10px;z-index:100;flex-shrink:0}
.hdr-logo{font-family:var(--fh);font-size:1.22rem;font-weight:700;color:var(--white);letter-spacing:.08em;white-space:nowrap;flex-shrink:0}
.hdr-logo span{color:var(--red)}
.hdr-nav{display:flex;gap:1px;flex:1;overflow-x:auto}
.nb{font-family:var(--fh);font-size:.8rem;font-weight:600;letter-spacing:.1em;text-transform:uppercase;background:none;border:none;color:var(--dim);padding:6px 11px;cursor:pointer;border-radius:3px;white-space:nowrap;transition:all .12s;position:relative}
.nb:hover{color:var(--white);background:var(--glass)}
.nb.on{color:var(--amber)}
.nb.on::after{content:'';position:absolute;bottom:-1px;left:8px;right:8px;height:2px;background:var(--amber)}
.hdr-tools{display:flex;gap:5px;align-items:center;flex-shrink:0}
.tb{font-family:var(--fm);font-size:.65rem;letter-spacing:.1em;text-transform:uppercase;background:var(--glass);border:1px solid var(--border);color:var(--dim);padding:5px 9px;border-radius:3px;cursor:pointer;transition:all .12s;white-space:nowrap}
.tb:hover{color:var(--white);border-color:var(--dim2)}
.tb.on{color:var(--amber);border-color:var(--amber);background:rgba(242,169,0,.08)}
.tb.ron{color:var(--red);border-color:var(--red);background:rgba(232,71,42,.08)}

/* MAIN */
#main{flex:1;display:flex;overflow:hidden;min-height:0}

/* LEFT PANEL */
#lp{width:176px;flex-shrink:0;background:var(--bg2);border-right:1px solid var(--border);display:flex;flex-direction:column;overflow-y:auto;overflow-x:hidden}
.lp-fam{padding:8px 8px 2px}
.lp-fl{font-family:var(--fm);font-size:.6rem;letter-spacing:.2em;text-transform:uppercase;color:var(--dim2);margin-bottom:5px;padding-left:4px}
.yb{display:flex;align-items:center;width:100%;background:none;border:none;color:var(--dim);font-family:var(--fm);font-size:.76rem;padding:4px 8px;cursor:pointer;border-radius:3px;transition:all .12s;text-align:left;gap:5px}
.yb:hover{background:var(--glass2);color:var(--white)}
.yb.on{background:rgba(242,169,0,.1);color:var(--amber)}
.ybadge{font-size:.56rem;letter-spacing:.07em;padding:1px 5px;border-radius:2px;flex-shrink:0}
.b3d{background:rgba(232,71,42,.18);color:var(--red);border:1px solid rgba(232,71,42,.3)}
.bsp{background:rgba(255,255,255,.05);color:var(--dim2);border:1px solid var(--border)}
.vb{display:block;width:100%;background:none;border:none;color:var(--dim2);font-family:var(--fb);font-size:.7rem;padding:2px 8px 2px 22px;cursor:pointer;border-radius:2px;transition:all .12s;text-align:left}
.vb:hover{color:var(--white);background:var(--glass)}
.vb.on{color:var(--white)}

/* VIEWER */
#vw{flex:1;position:relative;background:var(--bg);min-width:0;overflow:hidden}
#tc{display:block;width:100%;height:100%}

/* VIEW PRESETS */
#vpc{position:absolute;bottom:12px;left:50%;transform:translateX(-50%);display:flex;gap:3px;background:rgba(10,10,12,.85);border:1px solid var(--border);border-radius:4px;padding:4px}
.vpb{font-family:var(--fm);font-size:.58rem;letter-spacing:.07em;text-transform:uppercase;background:none;border:none;color:var(--dim);padding:5px 8px;border-radius:2px;cursor:pointer;transition:all .12s}
.vpb:hover{background:var(--glass2);color:var(--white)}
.vpb.on{background:rgba(242,169,0,.12);color:var(--amber)}

/* VEHICLE INFO */
#vi{position:absolute;top:10px;left:10px;z-index:10;background:rgba(10,10,12,.88);border:1px solid var(--border);border-radius:4px;padding:8px 12px;pointer-events:none}
.vi-n{font-family:var(--fh);font-size:1rem;font-weight:700;color:var(--white);line-height:1.2}
.vi-s{font-family:var(--fm);font-size:.65rem;color:var(--amber);letter-spacing:.07em;margin-top:2px}

/* ACTION BTNS overlay */
#abx{position:absolute;top:10px;right:10px;z-index:10;display:flex;flex-direction:column;gap:5px}
.ab{font-family:var(--fm);font-size:.62rem;letter-spacing:.1em;text-transform:uppercase;background:rgba(10,10,12,.9);border:1px solid var(--border);color:var(--dim);padding:6px 10px;border-radius:3px;cursor:pointer;transition:all .15s;text-align:center}
.ab:hover{color:var(--amber);border-color:var(--amber)}
.ab.red:hover{color:var(--red);border-color:var(--red)}

/* FITMENT STRIP */
#fstrip{position:absolute;top:92px;left:14px;transform:none;pointer-events:none;z-index:9;display:flex;flex-direction:column;gap:3px;align-items:flex-start}
.fw{font-family:var(--fm);font-size:.68rem;padding:5px 14px;border-radius:3px;text-align:center;white-space:nowrap}
.fw.ok{background:rgba(74,222,128,.1);border:1px solid rgba(74,222,128,.3);color:#4ade80}
.fw.warn{background:rgba(248,113,113,.1);border:1px solid rgba(248,113,113,.35);color:#f87171}

/* ISOLATION OVERLAY */
#iso{position:absolute;inset:0;z-index:200;background:rgba(0,0,0,.82);display:flex;align-items:center;justify-content:center;gap:20px;opacity:0;pointer-events:none;transition:opacity .3s}
#iso.on{opacity:1;pointer-events:all}
#iso-canvas-wrap{position:relative;width:min(480px,55vw);height:min(380px,55vh);background:radial-gradient(ellipse at center,rgba(242,169,0,.07) 0%,rgba(10,10,12,.96) 70%);border:1px solid rgba(242,169,0,.2);border-radius:6px;overflow:hidden;flex-shrink:0}
#iso-canvas{display:block;width:100%;height:100%}
#iso-panel{width:200px;background:var(--bg2);border:1px solid var(--border);border-radius:5px;padding:14px;overflow-y:auto;max-height:380px;flex-shrink:0}
.ip-name{font-family:var(--fh);font-size:1.15rem;font-weight:700;color:var(--amber);margin-bottom:2px}
.ip-cat{font-family:var(--fm);font-size:.6rem;letter-spacing:.2em;color:var(--dim2);text-transform:uppercase;margin-bottom:10px}
.ip-desc{font-size:.75rem;color:var(--dim);line-height:1.5;margin-bottom:10px}
.ip-spec{display:flex;justify-content:space-between;padding:4px 0;border-bottom:1px solid var(--border);font-size:.7rem}
.ip-spec span:first-child{color:var(--dim2);font-family:var(--fm);font-size:.62rem;letter-spacing:.05em}
.ip-spec span:last-child{color:var(--white);font-family:var(--fm)}
.ip-hint{font-family:var(--fm);font-size:.6rem;color:var(--dim2);text-align:center;margin:10px 0}
.ip-buy{display:block;width:100%;margin-top:10px;padding:9px;background:var(--red);color:#fff;font-family:var(--fh);font-size:.85rem;font-weight:700;letter-spacing:.08em;text-transform:uppercase;text-align:center;text-decoration:none;border-radius:3px;border:none;cursor:pointer;transition:background .15s}
.ip-buy:hover{background:var(--red2)}
#iso-close{position:absolute;top:8px;right:8px;background:none;border:1px solid var(--border);color:var(--dim);width:26px;height:26px;border-radius:3px;cursor:pointer;font-size:.9rem;display:flex;align-items:center;justify-content:center;transition:all .15s;z-index:10}
#iso-close:hover{color:var(--white);border-color:var(--dim)}
.iso-hint{font-family:var(--fm);font-size:.6rem;letter-spacing:.1em;color:var(--dim2);text-align:center;margin-top:8px}

/* RIGHT PANEL */
#rp{width:296px;flex-shrink:0;background:var(--bg2);border-left:1px solid var(--border);display:flex;flex-direction:column;overflow:hidden}
.rp-tabs{display:flex;border-bottom:1px solid var(--border);overflow-x:auto;flex-shrink:0}
.rpt{font-family:var(--fm);font-size:.6rem;letter-spacing:.1em;text-transform:uppercase;background:none;border:none;color:var(--dim2);padding:8px 9px;cursor:pointer;white-space:nowrap;transition:all .12s;border-bottom:2px solid transparent;margin-bottom:-1px}
.rpt:hover{color:var(--white);background:var(--glass)}
.rpt.on{color:var(--amber);border-bottom-color:var(--amber)}
.rp-body{flex:1;overflow-y:auto;padding:10px}
.sh{font-family:var(--fh);font-size:.88rem;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--white);margin:10px 0 7px;border-left:3px solid var(--red);padding-left:7px}

/* Part cards */
.pc{background:var(--bg3);border:1px solid var(--border);border-radius:4px;padding:9px;margin-bottom:7px;cursor:pointer;transition:all .15s}
.pc:hover{border-color:var(--amber);background:rgba(242,169,0,.025)}
.pc.sel{border-color:var(--red);background:rgba(232,71,42,.055)}
.pc-n{font-family:var(--fh);font-size:.86rem;font-weight:600;color:var(--white);margin-bottom:2px}
.pc-br{font-family:var(--fm);font-size:.6rem;letter-spacing:.1em;color:var(--amber);text-transform:uppercase}
.pc-sp{font-size:.7rem;color:var(--dim);margin:3px 0;line-height:1.4}
.pc-d{font-family:var(--fm);font-size:.7rem;font-weight:700;color:#4ade80}
.pc-d.neg{color:#f87171}
.pc-foot{display:flex;justify-content:space-between;align-items:center;margin-top:5px}
.pc-pr{font-family:var(--fm);font-size:.8rem;font-weight:700;color:var(--amber)}
.buy-btn{font-family:var(--fm);font-size:.58rem;letter-spacing:.1em;text-transform:uppercase;padding:4px 8px;background:var(--red);color:#fff;border:none;border-radius:2px;cursor:pointer;text-decoration:none;display:inline-block;transition:background .15s}
.buy-btn:hover{background:var(--red2)}

/* Color grid */
.cgrid{display:grid;grid-template-columns:repeat(5,1fr);gap:6px;margin:8px 0}
.cs{aspect-ratio:1;border-radius:3px;cursor:pointer;border:2px solid transparent;transition:all .15s;position:relative}
.cs:hover,.cs.sel{border-color:var(--amber);transform:scale(1.06)}
.cs .ct{position:absolute;bottom:calc(100% + 4px);left:50%;transform:translateX(-50%);background:var(--bg);border:1px solid var(--border);color:var(--white);font-size:.58rem;padding:2px 6px;white-space:nowrap;border-radius:2px;opacity:0;pointer-events:none;transition:opacity .15s;font-family:var(--fm);z-index:5}
.cs:hover .ct{opacity:1}

/* Height slider */
.hslide-wrap{padding:8px 0}
.hslide-lbl{display:flex;justify-content:space-between;font-family:var(--fm);font-size:.7rem;color:var(--dim);margin-bottom:7px}
.hslide-lbl #hs-val{color:var(--amber);font-weight:700}
input[type=range].hslide{-webkit-appearance:none;width:100%;height:4px;background:linear-gradient(90deg,var(--red) 0%,var(--amber) 50%,#333 50%);border-radius:2px;outline:none;cursor:pointer}
input[type=range].hslide::-webkit-slider-thumb{-webkit-appearance:none;width:16px;height:16px;border-radius:50%;background:var(--amber);box-shadow:0 0 8px rgba(242,169,0,.6);cursor:pointer}

/* Spec row */
.srow{display:flex;justify-content:space-between;align-items:center;padding:4px 0;border-bottom:1px solid var(--border);font-size:.72rem}
.srow span:first-child{color:var(--dim2);font-family:var(--fm);font-size:.64rem;letter-spacing:.05em;text-transform:uppercase}
.srow span:last-child{color:var(--white);font-family:var(--fm)}

/* HP display */
.hp-big{font-family:var(--fh);font-size:2.2rem;font-weight:700;color:var(--amber);text-align:center;margin:6px 0;text-shadow:var(--glow-a)}
.hp-lbl{font-family:var(--fm);font-size:.62rem;letter-spacing:.2em;color:var(--dim2);text-transform:uppercase;text-align:center}

/* Toggle */
.tog-row{display:flex;align-items:center;gap:8px;padding:9px;background:rgba(232,71,42,.07);border:1px solid rgba(232,71,42,.22);border-radius:4px;margin:7px 0;cursor:pointer;transition:all .15s}
.tog-row:hover{background:rgba(232,71,42,.14)}
.tog-lbl{font-family:var(--fh);font-size:.85rem;font-weight:600;color:var(--red);flex:1}
.tog-sub{font-size:.66rem;color:var(--dim2);display:block}
.sw{width:34px;height:18px;border-radius:9px;background:#222;border:1px solid #444;position:relative;flex-shrink:0;transition:background .2s}
.sw::after{content:'';position:absolute;width:12px;height:12px;border-radius:50%;background:#555;top:2px;left:2px;transition:left .2s,background .2s}
.sw.on{background:rgba(232,71,42,.3);border-color:var(--red)}
.sw.on::after{left:18px;background:var(--red)}

/* Toast */
#toast{position:fixed;bottom:28px;left:50%;transform:translateX(-50%) translateY(60px);background:rgba(10,10,12,.96);border:1px solid var(--amber);color:var(--amber);font-family:var(--fm);font-size:.72rem;letter-spacing:.1em;padding:10px 22px;border-radius:4px;z-index:9999;transition:transform .3s ease,opacity .3s ease;opacity:0}
#toast.show{transform:translateX(-50%) translateY(0);opacity:1}

::-webkit-scrollbar{width:3px;height:3px}
::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{background:rgba(255,255,255,.1);border-radius:2px}
@media(max-width:900px){#lp{display:none}#rp{width:240px}}
</style>
</head>
<body>

<!-- HERO -->
<div id="hero">
  <div id="hbg"></div><div id="hov"></div>
  <div class="smoke" style="width:600px;height:400px;background:radial-gradient(circle,rgba(232,71,42,.22),transparent);top:10%;left:-10%;animation-duration:18s"></div>
  <div class="smoke" style="width:400px;height:300px;background:radial-gradient(circle,rgba(242,169,0,.15),transparent);bottom:15%;right:-5%;animation-duration:14s;animation-delay:-7s"></div>
  <div class="smoke" style="width:350px;height:250px;background:radial-gradient(circle,rgba(100,100,200,.1),transparent);top:40%;right:20%;animation-duration:22s;animation-delay:-3s"></div>
  <div class="hc">
    <div class="hlogo">BLOWER<b>BUILDZ</b></div>
    <div class="htag">Build it. Know it. Own it.</div>
    <div class="hded" style="font-family:var(--fm);font-size:.62rem;letter-spacing:.14em;color:rgba(242,169,0,.85);text-transform:uppercase;margin-bottom:26px;margin-top:-22px">Dedicated to my son Jameson</div>
    <div class="hchips">
      <div class="hchip">6 MODELS</div>
      <div class="hchip">50+ VARIANTS</div>
      <div class="hchip">IRON MAN X-RAY</div>
      <div class="hchip">FITMENT ENGINE</div>
      <div class="hchip">DRAG RACE SIM</div>
    </div>
    <button class="hcta" onclick="enterApp()">ENTER THE CONFIGURATOR</button>
  </div>
</div>

<!-- APP -->
<div id="app">
  <!-- HEADER -->
  <div id="hdr">
    <div class="hdr-logo">BLOWER<span>BUILDZ</span></div>
    <nav class="hdr-nav" id="famNav"></nav>
    <div class="hdr-tools">
      <button class="tb" id="xrayBtn" onclick="toggleXray()">X-RAY</button>
      <button class="tb" id="nightBtn" onclick="toggleNight()">NIGHT</button>
      <button class="tb" id="dragBtn" onclick="openDrag()">DRAG RACE</button>
      <button class="tb" id="demonBtn" onclick="toggleDemon()" style="display:none">DEMON MODE</button>
    </div>
  </div>
  <!-- MAIN -->
  <div id="main">
    <!-- LEFT -->
    <div id="lp" id="leftPanel"></div>
    <!-- VIEWER -->
    <div id="vw">
      <canvas id="tc"></canvas>
      <div id="vi">
        <div class="vi-n" id="viName">Select a Vehicle</div>
        <div class="vi-s" id="viSpec"></div>
      </div>
      <div id="abx">
        <button class="ab" onclick="resetBuild()">↺ RESET STOCK</button>
        <button class="ab" onclick="saveBuild()">⬇ SAVE BUILD</button>
      </div>
      <div id="vpc">
        <button class="vpb" onclick="setView('front')">FRONT</button>
        <button class="vpb" onclick="setView('rear')">REAR</button>
        <button class="vpb" onclick="setView('driver')">DRIVER</button>
        <button class="vpb" onclick="setView('pass')">PASS</button>
        <button class="vpb on" onclick="setView('3qfront')">3/4 F</button>
        <button class="vpb" onclick="setView('3qrear')">3/4 R</button>
        <button class="vpb" onclick="setView('top')">TOP</button>
      </div>
      <div id="fstrip"></div>
      <!-- ISOLATION OVERLAY -->
      <div id="iso">
        <div id="iso-canvas-wrap">
          <canvas id="iso-canvas"></canvas>
          <button id="iso-close" onclick="closeIso()">✕</button>
          <div class="iso-hint">DRAG TO ROTATE • SCROLL TO ZOOM</div>
        </div>
        <div id="iso-panel">
          <div class="ip-name" id="ip-name"></div>
          <div class="ip-cat" id="ip-cat"></div>
          <div class="ip-desc" id="ip-desc"></div>
          <div id="ip-specs"></div>
          <a class="ip-buy" id="ip-buy" href="#" target="_blank" rel="noopener">VIEW ON AMAZON →</a>
        </div>
      </div>
    </div>
    <!-- RIGHT -->
    <div id="rp">
      <div class="rp-tabs" id="rpTabs"></div>
      <div class="rp-body" id="rpBody"></div>
    </div>
  </div>
</div>

<!-- DRAG RACE MODAL -->
<div id="dragModal" style="display:none;position:fixed;inset:0;background:rgba(0,0,0,.88);z-index:500;align-items:center;justify-content:center;flex-direction:column;gap:16px">
  <div style="background:var(--bg2);border:1px solid var(--border);border-radius:6px;padding:24px;max-width:580px;width:90%;max-height:80vh;overflow-y:auto">
    <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:16px">
      <div style="font-family:var(--fh);font-size:1.4rem;font-weight:700;color:var(--amber)">DRAG RACE SIMULATOR</div>
      <button onclick="closeDrag()" style="background:none;border:1px solid var(--border);color:var(--dim);width:28px;height:28px;border-radius:3px;cursor:pointer;font-size:.9rem">✕</button>
    </div>
    <div style="display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:16px">
      <div style="background:var(--bg3);border:1px solid var(--border);padding:12px;border-radius:4px">
        <div style="font-family:var(--fm);font-size:.62rem;letter-spacing:.2em;color:var(--dim2);text-transform:uppercase;margin-bottom:6px">MY BUILD</div>

function setView(v){
  const presets={
    'front':  {theta:0,    phi:0.18, dist:7},
    'rear':   {theta:Math.PI, phi:0.18, dist:7},
    'driver': {theta:Math.PI*1.5, phi:0.22, dist:6},
    'pass':   {theta:Math.PI*0.5, phi:0.22, dist:6},
    '3qfront':{theta:-0.62, phi:0.20, dist:6.4},
    '3qrear': {theta:Math.PI+0.6, phi:0.28, dist:7.5},
    'top':    {theta:0, phi:1.15, dist:9}
  };
  const p=presets[v]||presets['front'];
  window.BB_CAM=null; window.__bbUserCam=true;
  // Animate smoothly
  const t0=performance.now();
  const t0Theta=camTheta, t0Phi=camPhi, t0Dist=camDist;
  const dur=600;
  function lerp(a,b,t){return a+(b-a)*t;}
  function step(now){
    const t=Math.min((now-t0)/dur,1);
    const e=t<0.5?2*t*t:(1-Math.pow(-2*t+2,2)/2);
    camTheta=lerp(t0Theta,p.theta,e);
    camPhi=lerp(t0Phi,p.phi,e);
    camDist=lerp(t0Dist,p.dist,e);
    updateCamera();
    if(t<1) requestAnimationFrame(step);
  }
  requestAnimationFrame(step);
  document.querySelectorAll('.vpb').forEach(b=>b.classList.toggle('on',b.getAttribute('onclick')?.includes("'"+v+"'")));
}

function setDefaultHeroView(){
  var theta=-0.62, phi=0.13, ty=0.62, dist=8.6;
  try{
    if(typeof carGroup!=='undefined' && carGroup && window.THREE){
      var box=new THREE.Box3().setFromObject(carGroup);
      var sz=box.getSize(new THREE.Vector3()), ctr=box.getCenter(new THREE.Vector3());
      ty=ctr.y;
      var radius=0.5*Math.sqrt(sz.x*sz.x+sz.y*sz.y+sz.z*sz.z);
      var vFov=(camera&&camera.fov?camera.fov:45)*Math.PI/180;
      var asp=(camera&&camera.aspect?camera.aspect:1.4);
      var hFov=2*Math.atan(Math.tan(vFov/2)*Math.min(1,asp));
      var fit=radius/Math.sin(Math.min(vFov,hFov)/2);
      dist=fit*1.95; // generous margin so wheels + whole body stay in frame with breathing room
      ty=ctr.y*0.80; // aim slightly below center
    }
  }catch(e){}
  window.BB_CAM={theta:theta,phi:phi,dist:dist,ty:ty};
  camTheta=theta;camPhi=phi;camDist=dist;camTarget.y=ty;
  if(typeof updateCamera==='function')updateCamera();
  document.querySelectorAll('.vpb').forEach(b=>b.classList.toggle('on',(b.getAttribute('onclick')||'').includes("'3qfront'")));
}
window.setDefaultHeroView=setDefaultHeroView;
function updateCamera(){
  if(window.BB_CAM){camTheta=window.BB_CAM.theta;camPhi=window.BB_CAM.phi;camDist=window.BB_CAM.dist;camTarget.y=window.BB_CAM.ty;}
  const r=camDist;
  const x=r*Math.cos(camPhi)*Math.sin(camTheta)+camTarget.x;
  const y=r*Math.sin(camPhi)+camTarget.y;
  const z=r*Math.cos(camPhi)*Math.cos(camTheta)+camTarget.z;
  camera.position.set(x,y,z);
  camera.lookAt(camTarget.x,camTarget.y,camTarget.z);
}

function onMouseDown(e){if(e.target.closest('#iso')) return; isDragging=true;window.__bbUserCam=true;window.BB_CAM=null;lastMouse={x:e.clientX,y:e.clientY}}
function onMouseUp(){isDragging=false}
function onMouseMove(e){
  if(!isDragging) return;
  const dx=e.clientX-lastMouse.x, dy=e.clientY-lastMouse.y;
  lastMouse={x:e.clientX,y:e.clientY};
  camTheta-=dx*0.006;
  camPhi=Math.max(0.05,Math.min(1.45,camPhi-dy*0.004));
  updateCamera();
}
function onWheel(e){
  e.preventDefault();
  camDist=Math.max(2,Math.min(18,camDist+e.deltaY*0.012));
  updateCamera();
}
let t0Touch={x:0,y:0};
function onTouchStart(e){
  if(e.touches.length===1){isDragging=true;t0Touch={x:e.touches[0].clientX,y:e.touches[0].clientY};lastMouse=t0Touch;}
  if(e.touches.length===2){const dx=e.touches[0].clientX-e.touches[1].clientX,dy=e.touches[0].clientY-e.touches[1].clientY;touchDist=Math.sqrt(dx*dx+dy*dy);}
}
function onTouchMove(e){
  e.preventDefault();
  if(e.touches.length===1&&isDragging){
    const dx=e.touches[0].clientX-lastMouse.x,dy=e.touches[0].clientY-lastMouse.y;
    lastMouse={x:e.touches[0].clientX,y:e.touches[0].clientY};
    camTheta-=dx*0.007;camPhi=Math.max(0.05,Math.min(1.45,camPhi-dy*0.005));updateCamera();
  }
  if(e.touches.length===2){
    const dx=e.touches[0].clientX-e.touches[1].clientX,dy=e.touches[0].clientY-e.touches[1].clientY;
    const d=Math.sqrt(dx*dx+dy*dy);
    camDist=Math.max(2,Math.min(18,camDist+(touchDist-d)*0.04));
    touchDist=d;updateCamera();
  }
}

function setupIsoControls(){
  const ic=document.getElementById('iso-canvas');
  ic.addEventListener('mousedown',e=>{isoDragging=true;isoLastMouse={x:e.clientX,y:e.clientY}});
  ic.addEventListener('mouseup',()=>{isoDragging=false});
  ic.addEventListener('mousemove',e=>{
    if(!isoDragging) return;
    const dx=e.clientX-isoLastMouse.x,dy=e.clientY-isoLastMouse.y;
    isoLastMouse={x:e.clientX,y:e.clientY};
    isoTheta+=dx*0.01; isoPhi=Math.max(-1.2,Math.min(1.2,isoPhi-dy*0.008));
    updateIsoCamera();
  });
  ic.addEventListener('wheel',e=>{
    e.preventDefault();
    const d=isoCamera.position.distanceTo(new THREE.Vector3(0,0,0));
    isoCamera.position.setLength(Math.max(1,Math.min(6,d+e.deltaY*0.01)));
  },{passive:false});
}
function updateIsoCamera(){
  const r=isoCamera.position.length();
  isoCamera.position.set(r*Math.cos(isoPhi)*Math.sin(isoTheta),r*Math.sin(isoPhi),r*Math.cos(isoPhi)*Math.cos(isoTheta));
  isoCamera.lookAt(0,0,0);
}

// ========== CAR BUILDER - procedural Three.js geometry ==========
// Each family gets a uniquely shaped car built from primitives
// with PBR materials. Parts are added as named child meshes.

const MAT_CACHE = {};
function getPBR(opts){
  const key=JSON.stringify(opts);
  if(MAT_CACHE[key]) return MAT_CACHE[key];
  const m=new THREE.MeshStandardMaterial(opts);
  MAT_CACHE[key]=m; return m;
}

function carBodyMat(hexColor, xray){
  const c=new THREE.Color(hexColor);
  return getPBR({color:c,metalness:0.72,roughness:0.14,envMapIntensity:1.2,
    transparent:xray,opacity:xray?0.18:1,side:xray?THREE.DoubleSide:THREE.FrontSide,
    depthWrite:!xray});
}
function glassMat(xray){
  return getPBR({color:0x112244,metalness:0.3,roughness:0.05,transparent:true,opacity:xray?0.06:0.35,
    side:THREE.DoubleSide,depthWrite:false});
}
function chromeMat(){return getPBR({color:0xcccccc,metalness:1,roughness:0.05});}
function tireMat(){return getPBR({color:0x111111,metalness:0,roughness:0.85});}
function wheelMat(hex){return getPBR({color:new THREE.Color(hex||'#aaaaaa'),metalness:0.8,roughness:0.2});}
function carbonMat(){return getPBR({color:0x0e0e12,metalness:0.2,roughness:0.6});}
function interiorMat(){return getPBR({color:0x1a0505,metalness:0,roughness:0.8});}
function redMat(){return getPBR({color:0xE8472A,metalness:0.5,roughness:0.3,emissive:0x300800,emissiveIntensity:0.3});}

// Shared geometry helpers
function box(w,h,d){return new THREE.BoxGeometry(w,h,d,2,2,2);}
function cyl(rt,rb,h,s){return new THREE.CylinderGeometry(rt,rb,h,s||24);}
function sph(r,ws,hs){return new THREE.SphereGeometry(r,ws||16,hs||12);}

function buildCar(family){
  while(carGroup.children.length) carGroup.remove(carGroup.children[0]);
  MAT_CACHE['_body']=null;

  const fam=FAMILIES[family];
  const col=currentColor.hex;

  switch(family){
    case 'challenger': buildChallenger(col); break;
    case 'charger':    buildCharger(col); break;
    case 'demon':      buildDemon(col); break;
    case 'trackhawk':  buildTrackhawk(col); break;
    case 'c300':       buildC300(col); break;
    default:           buildChallenger(col);
  }

  // Apply x-ray mode
  if(isXray) applyXray(true);

  // Apply height drop
  applyHeight(heightDrop);

  // Shadow
  carGroup.traverse(o=>{if(o.isMesh){o.castShadow=true;o.receiveShadow=true;}});
  carGroup.traverse(o=>{if(o.material&&typeof R_GLASS!=='undefined'&&o.material===R_GLASS)o.castShadow=false;});
  if(typeof R_applyTint==='function')R_applyTint();
}

function addHeadlights(g, fz, fy, size){
  const lMat=new THREE.MeshStandardMaterial({color:0xffffff,emissive:0xffeedd,emissiveIntensity:0.8,roughness:0.05,metalness:0.2});
  const lGeo=new THREE.BoxGeometry(size.x,0.15,0.1);
  const ll=new THREE.Mesh(lGeo,lMat);ll.position.set(-size.x/2-0.15,fy,fz);ll.name='headlight_l';g.add(ll);
  const lr=new THREE.Mesh(lGeo,lMat);lr.position.set(size.x/2+0.15,fy,fz);lr.name='headlight_r';g.add(lr);
  // Inner halo rings
  [ll,lr].forEach((l,i)=>{
    const ring=new THREE.Mesh(new THREE.RingGeometry(0.05,0.08,16),new THREE.MeshStandardMaterial({color:0xffffff,emissive:0xffffff,emissiveIntensity:1.5,side:THREE.DoubleSide}));
    ring.position.set(0,0,0.06);l.add(ring);
  });
}

function addTaillights(g, rz, ry, size){
  const tMat=new THREE.MeshStandardMaterial({color:0xff2200,emissive:0xff1100,emissiveIntensity:1.0,roughness:0.2,metalness:0.1});
  const lMat=new THREE.MeshStandardMaterial({color:0xee4400,emissive:0xee2200,emissiveIntensity:0.8,roughness:0.2,metalness:0.1});
  const tGeo=new THREE.BoxGeometry(0.55,0.18,0.1);
  const tl=new THREE.Mesh(tGeo,tMat);tl.position.set(-0.65,ry||0.6,rz);tl.name='taillight_l';g.add(tl);
  const tr=new THREE.Mesh(tGeo,tMat);tr.position.set(0.65,ry||0.6,rz);tr.name='taillight_r';g.add(tr);
  // Sequential inner strips
  for(let i=0;i<3;i++){
    const strip=new THREE.Mesh(new THREE.BoxGeometry(0.08,0.1,0.06),lMat);
    strip.position.set(-0.18+i*0.18,0,0.06);
    tl.add(strip); const stripR=strip.clone(); tr.add(stripR);
  }
}

function addWheels(g, opts){
  const {rb,rf,h,wr,yoffset=0} = opts;
  const baseY=wr+(yoffset||0);
  const wm=wheelMat(activeParts.wheels?PARTS_DATA.wheels.find(w=>w.id===activeParts.wheels)?.hexColor:'#8a8a8a');
  const tm=tireMat();
  const positions=[
    {x:-h, z:rf,  name:'wheel_fr'},
    {x: h, z:rf,  name:'wheel_fl'},
    {x:-h, z:-rb, name:'wheel_rr'},
    {x: h, z:-rb, name:'wheel_rl'}
  ];
  positions.forEach(p=>{
    const wheelGroup=new THREE.Group();
    wheelGroup.name=p.name;
    wheelGroup.position.set(p.x,baseY,p.z);
    // Tire
    const tire=new THREE.Mesh(cyl(wr,wr,0.22,28),tm);
    tire.rotation.z=Math.PI/2; tire.name='tire';
    wheelGroup.add(tire);
    // Rim
    const rim=new THREE.Mesh(cyl(wr*0.7,wr*0.7,0.24,28),wm);

function applyXrayBase(on){
  isXray=on;
  const col=currentColor.hex;
  carGroup.traverse(o=>{
    if(!o.isMesh) return;
    const n=o.name||'';
    // Body panels go transparent
    if(n==='body'||n==='roof'||n==='hood'||n.includes('fascia')||n.includes('door')||n.includes('sill')||n.includes('trunk')||n.includes('hood')){
      o.material=carBodyMat(col,on);
    }
    // Glass goes very transparent
    if(n.includes('glass')||n.includes('windshield')){
      o.material=glassMat(on);
    }
    // Internal parts become visible
    const internalNames=['engine','supercharger','headers','headers_r','front_coilover','front_coilover_r','rear_coilover','rear_coilover_r','sway_bar','brakes','subwoofer','dual_battery','driver_seat','obd_port'];
    if(internalNames.some(k=>n===k)){
      o.material=o.material.clone();
      o.material.transparent=true;
      o.material.opacity=on?0.85:0;
      o.material.depthWrite=!on;
    }
  });
}

function setBodyColor(hex){
  currentColor=OEM_COLORS.find(c=>c.hex===hex)||{hex,name:'Custom'};
  const newMat=carBodyMat(hex,isXray);
  carGroup.traverse(o=>{
    if(!o.isMesh) return;
    const n=o.name||'';
    if(n==='body'||n==='roof'||n==='hood'||n.includes('fascia')||n.includes('door')||n.includes('sill')||n.includes('trunk')){
      o.material=newMat;
    }
  });
}

function applyHeight(drop){
  heightDrop=drop;
  // Raise/lower entire carGroup except wheels
  const wheelNames=['wheel_fr','wheel_fl','wheel_rr','wheel_rl'];
  const baseY=-drop*0.088;
  carGroup.traverse(o=>{
    if(wheelNames.includes(o.name)) return;
    if(o===carGroup) return;
  });
  // Move body lower (shift group down)
  carGroup.position.y=baseY;
  // Update fitment UI
  updateFitmentWarning();
}

function applyWheels(partId){
  activeParts.wheels=partId;
  const part=PARTS_DATA.wheels.find(w=>w.id===partId);
  const hex=part?.hexColor||'#888888';
  const wMat=wheelMat(hex);
  carGroup.traverse(o=>{
    if(o.name==='rim'){o.material=wMat;}
    if(o.name==='center_cap'){o.material=wMat;}
  });
  // Rebuild wheels for skinny demon special
  if(partId==='demon_skinny'){
    addSkinnyFronts(carGroup, 1.88);
  }
  updateFitmentWarning();
}

function updateFitmentWarning(){
  const strip=document.getElementById('fstrip');
  if(!strip) return;
  const rules=isWidebody?FITMENT_RULES.widebody:FITMENT_RULES.standard;
  const warnings=[];
  if(heightDrop===3 && activeParts.wheels==='stock_wheels'){
    warnings.push({type:'ok',msg:'⚡ Air ride at maximum drop - slammed stance'});
  }
  if(activeParts.wheels==='demon_skinny'){
    warnings.push({type:'ok',msg:'✓ Demon Crate skinny fronts - Track Config active'});
  }
  const wPart=PARTS_DATA.wheels.find(w=>w.id===activeParts.wheels);
  if(wPart && !wPart.demonOnly){
    warnings.push({type:'ok',msg:`✓ 5×115 · ${isWidebody?'Widebody':'Standard'} fitment confirmed`});
  }
  strip.innerHTML=warnings.map(w=>`<div class="fw ${w.type}">${w.msg}</div>`).join('');
}

function openIso(partId){
  const part=XRAY_PARTS.find(p=>p.id===partId);
  if(!part) return;
  isoPartId=partId;
  // Build isolation model
  while(isoGroup.children.length) isoGroup.remove(isoGroup.children[0]);
  const builder=ISO_PARTS_3D[partId];
  if(builder) builder(isoGroup);
  else buildIsoGeneric(isoGroup, partId);
  // Reset camera
  isoTheta=0.5; isoPhi=0.25;
  isoCamera.position.set(2,1,2.8);
  isoCamera.lookAt(0,0,0);
  // Panel
  document.getElementById('ip-name').textContent=part.name;
  document.getElementById('ip-cat').textContent=part.cat;
  document.getElementById('ip-desc').textContent=part.desc;
  const specDiv=document.getElementById('ip-specs');
  specDiv.innerHTML=part.specs.map(s=>`<div class="ip-spec"><span>${s.k}</span><span>${s.v}</span></div>`).join('');
  document.getElementById('ip-buy').href=part.url;
  document.getElementById('ip-buy').textContent=part.url==='#'?'VIEW IN APP →':'VIEW ON AMAZON →';
  document.getElementById('iso').classList.add('on');
  isoActive=true;
}

function closeIso(){
  document.getElementById('iso').classList.remove('on');
  isoActive=false;

// Physics-accurate ET calculator
// Uses a power-to-weight trap speed model + traction coefficient correction
// Based on empirical Hellcat drag data (11.5s stock, 8.9s Demon 170)
function calcET(hp, weight, tractionCoeff, launchBonus) {
  // Step 1: Theoretical trap speed from kinetic energy at the 1/4 mile finish
  // Power delivered = hp * efficiency; at 1/4 mile in ~10-12s the car is running ~peak power
  const efficiency = 0.85; // drivetrain + aero loss
  const hpW = hp * 745.7 * efficiency; // watts
  const massKg = weight * 0.453592;
  // Trap KE = (1/2)*m*v^2 = hpW * t; solve numerically for consistent t+v
  // Use empirical formula: trap_mph ≈ 234 * cbrt(hp / weight)
  let trapMph = 234 * Math.pow(hp / weight, 1/3);
  // Traction correction: poor traction = less effective hp at launch
  trapMph *= (0.85 + tractionCoeff * 0.15);
  
  // Step 2: ET from trap speed using distance-time relationship
  // 1/4 mile = 1320 ft; avg speed = trapMph * 0.59 (acceleration curve factor)
  const avgMph = trapMph * 0.59;
  const etRaw = (1320 / (avgMph * 5280 / 3600));
  
  // Step 3: Launch quality correction
  const et = etRaw - launchBonus;
  
  // Clamp to realistic range
  return Math.max(8.5, Math.min(16.5, et));
}

// Calculate trap speed separately for display
function calcTrap(hp, weight, tractionCoeff) {
  const trapMph = 234 * Math.pow(hp / weight, 1/3);
  return Math.round(trapMph * (0.85 + tractionCoeff * 0.15));
}

let raceAnimFrame = null;
let raceRunning = false;

function runRace(){
  if(raceRunning) return;
  
  const fam = FAMILIES[currentFamily];
  const yr = fam.years[currentYearIdx] || fam.years[0];
  const hp = isDemonMode ? yr.hp : (yr.hp || 707);
  const wt = yr.w || fam.weight;
  
  // Traction coefficients by tire selection
  const tireSel = document.getElementById('dragTires')?.value || '0';
  let tractionCoeff, tireName;
  if(tireSel === '0.7') { tractionCoeff = 0.98; tireName = 'Drag Radials'; }
  else if(tireSel === '0.3') { tractionCoeff = 0.88; tireName = 'Sticky 200TW'; }
  else { tractionCoeff = 0.72; tireName = 'Street Tires'; }
  
  // Launch bonus in seconds
  const launchBonus = parseFloat(document.getElementById('dragLaunch')?.value || 0);
  
  const oppKey = document.getElementById('oppSelect')?.value || 'camaro_zl1';
  const opp = OPPONENTS[oppKey];
  
  // My ET uses configured traction + launch bonus
  const myET = calcET(hp, wt, tractionCoeff, launchBonus);
  const myTrap = calcTrap(hp, wt, tractionCoeff);
  
  // Opponent uses their real-world known ET (not formula) for authenticity
  const oppET = opp.qtm;
  const oppTrap = opp.trap;
  
  const win = myET <= oppET;
  const box = document.getElementById('trackBox');
  box.style.display = 'block';
  document.getElementById('raceResult').innerHTML = '';
  
  // Reset car positions
  const myCar = document.getElementById('myCar');
  const oppCar = document.getElementById('oppCar');
  myCar.style.transition = 'left 0s';
  oppCar.style.transition = 'left 0s';
  myCar.style.left = '12%';
  oppCar.style.left = '12%';
  
  // Speed blur
  const blur = document.getElementById('speedBlur');
  
  raceRunning = true;
  
  // Countdown then launch
  let count = 3;
  document.getElementById('raceResult').innerHTML = `<div style="font-family:var(--fh);font-size:2rem;font-weight:700;color:var(--amber)">${count}</div>`;
  
  const countInterval = setInterval(() => {
    count--;
    if(count > 0) {
      document.getElementById('raceResult').innerHTML = `<div style="font-family:var(--fh);font-size:2rem;font-weight:700;color:var(--amber)">${count}</div>`;
    } else {
      clearInterval(countInterval);
      document.getElementById('raceResult').innerHTML = `<div style="font-family:var(--fh);font-size:1.6rem;font-weight:700;color:var(--red);text-shadow:0 0 20px rgba(232,71,42,.8)">GO!</div>`;
      
      // Calculate finish positions proportionally
      // The winner goes to 84%, loser goes slightly less
      const myFinish = win ? '85%' : (84 - (oppET - myET) * 5) + '%';
      const oppFinish = win ? (85 - (myET - oppET) * 5) + '%' : '85%';
      
      // Animate: use ET ratio to set speed (lower ET = faster animation)
      const raceScale = 2.2; // base duration multiplier
      const myDuration = (myET / 11.5) * raceScale;
      const oppDuration = (oppET / 11.5) * raceScale;
      
      setTimeout(() => {
        if(blur) { blur.style.transition = 'opacity .3s'; blur.style.opacity = '1'; }
        myCar.style.transition = `left ${myDuration.toFixed(2)}s cubic-bezier(0.2,0,0.8,1)`;
        oppCar.style.transition = `left ${oppDuration.toFixed(2)}s cubic-bezier(0.2,0,0.8,1)`;
        myCar.style.left = myFinish;
        oppCar.style.left = oppFinish;
        
        // Show results after the winner crosses the line
        const resultDelay = Math.min(myDuration, oppDuration) * 1000 + 400;
        setTimeout(() => {
          if(blur) blur.style.opacity = '0';
          raceRunning = false;
          const margin = Math.abs(myET - oppET);
          const marginLabel = margin < 0.1 ? 'BY A BUMPER' : margin < 0.3 ? 'CLOSE' : margin < 0.8 ? 'SOLID WIN' : 'DOMINANT';
          document.getElementById('raceResult').innerHTML = `
<div style="font-family:var(--fh);font-size:1.6rem;font-weight:700;color:${win?'#4ade80':'#f87171'};margin-bottom:8px;text-shadow:${win?'0 0 20px rgba(74,222,128,.5)':'0 0 20px rgba(248,113,113,.5)'}">${win ? '🏆 WIN' : '❌ LOSS'} ${win && margin >= 0.1 ? '- ' + marginLabel : ''}</div>
<div style="display:grid;grid-template-columns:1fr 1fr;gap:8px;font-family:var(--fm);font-size:.72rem">
  <div style="background:var(--bg3);padding:10px;border-radius:4px;border:1px solid ${win?'rgba(74,222,128,.35)':'var(--border)'}">
    <div style="color:var(--dim2);margin-bottom:4px;font-size:.6rem;letter-spacing:.12em;text-transform:uppercase">MY BUILD</div>
    <div style="font-family:var(--fh);color:var(--amber);font-size:1.3rem;font-weight:700">${myET.toFixed(2)}s</div>
    <div style="color:var(--dim);margin-top:2px">@ ${myTrap} mph trap</div>
    <div style="color:var(--dim2);font-size:.62rem;margin-top:4px">${hp}hp · ${wt.toLocaleString()}lbs · ${tireName}</div>
  </div>
  <div style="background:var(--bg3);padding:10px;border-radius:4px;border:1px solid ${!win?'rgba(74,222,128,.35)':'var(--border)'}">
    <div style="color:var(--dim2);margin-bottom:4px;font-size:.6rem;letter-spacing:.12em;text-transform:uppercase">${opp.name.split(' ').slice(0,3).join(' ')}</div>
    <div style="font-family:var(--fh);color:var(--white);font-size:1.3rem;font-weight:700">${oppET.toFixed(2)}s</div>
    <div style="color:var(--dim);margin-top:2px">@ ${oppTrap} mph trap</div>
    <div style="color:var(--dim2);font-size:.62rem;margin-top:4px">${opp.hp}hp · real-world ET</div>
  </div>
</div>
<div style="margin-top:8px;font-family:var(--fm);font-size:.65rem;color:var(--dim2);text-align:center">Quarter mile · 1320 ft · ${Math.abs(myET-oppET).toFixed(2)}s gap</div>`;
        }, resultDelay);
      }, 150);
    }
  }, 800);
}

// Load build from URL hash
function loadFromUrl(){
  const p=new URLSearchParams(window.location.search);
  const b=p.get('build');
  if(!b) return;
  try{
    const config=JSON.parse(atob(b));
    currentFamily=config.family||'challenger';
    currentYearIdx=config.year?FAMILIES[currentFamily].years.findIndex(y=>y.y===config.year):0;
    if(currentYearIdx<0) currentYearIdx=0;
    currentVariantIdx=config.variant||0;
    if(config.color) currentColor={hex:config.color,name:'Custom'};
    if(config.parts) Object.assign(activeParts,config.parts);
    if(config.height) heightDrop=config.height;
    isWidebody=config.widebody||false;
    isDemonMode=config.demonMode||false;
    enterApp();
  } catch(e){}
}

});

function buildHotspotOverlay(){
  const vw = document.getElementById('vw');
  // Remove existing overlay if any
  const existing = document.getElementById('hotspot-layer');
  if(existing) existing.remove();

  if(!isXray) return; // Hotspots only in X-Ray mode

  const overlay = document.createElement('div');
  overlay.id = 'hotspot-layer';
  overlay.style.cssText = 'position:absolute;inset:0;pointer-events:none;z-index:20';
  vw.appendChild(overlay);

  XRAY_PARTS.forEach(part => {
    const pos = HOTSPOT_POSITIONS[part.id];
    if(!pos) return;

    const dot = document.createElement('div');
    dot.style.cssText = `
      position:absolute;
      left:${pos.x*100}%;

/* ================= v7 REALISM MODULE (Challenger quality bar) ================= */
const R_PI=Math.PI;
function R_ss(a,b,x){x=Math.min(1,Math.max(0,(x-a)/(b-a)));return x*x*(3-2*x);}
function R_sg(v){return v<0?-1:1;}
function R_cr(tbl,z){
  const n=tbl.length; if(z<=tbl[0][0])return tbl[0][1]; if(z>=tbl[n-1][0])return tbl[n-1][1];
  let i=0; while(z>tbl[i+1][0]) i++;
  const p0=tbl[Math.max(i-1,0)],p1=tbl[i],p2=tbl[i+1],p3=tbl[Math.min(i+2,n-1)];
  const dz=p2[0]-p1[0], t=(z-p1[0])/dz;
  const m1=(p2[1]-p0[1])/(p2[0]-p0[0])*dz, m2=(p3[1]-p1[1])/(p3[0]-p1[0])*dz;
  const t2=t*t,t3=t2*t;
  return (2*t3-3*t2+1)*p1[1]+(t3-2*t2+t)*m1+(-2*t3+3*t2)*p2[1]+(t3-t2)*m2;
}
function R_lin(hex){return new THREE.Color(hex).convertSRGBToLinear();}
function R_canvas(w,h){const c=document.createElement('canvas');c.width=w;c.height=h;return c;}
function R_tex(c,srgb,rep){const t=new THREE.CanvasTexture(c);if(srgb)t.encoding=THREE.sRGBEncoding;if(rep){t.wrapS=t.wrapT=THREE.RepeatWrapping;t.repeat.set(rep[0],rep[1]);}t.anisotropy=8;return t;}

/* ---------- studio environment (reflections) ---------- */
function R_makeEnv(rend){
  const pm=new THREE.PMREMGenerator(rend);
  const es=new THREE.Scene();
  const gc=R_canvas(16,256),g=gc.getContext('2d');
  const gr=g.createLinearGradient(0,0,0,256);
  gr.addColorStop(0,'#aeb9c9');gr.addColorStop(0.40,'#6b7482');gr.addColorStop(0.5,'#3a3f47');gr.addColorStop(0.52,'#1a1c20');gr.addColorStop(1,'#08090b');
  g.fillStyle=gr;g.fillRect(0,0,16,256);
  const gt=new THREE.CanvasTexture(gc);gt.encoding=THREE.sRGBEncoding;
  es.add(new THREE.Mesh(new THREE.SphereGeometry(60,32,24),new THREE.MeshBasicMaterial({map:gt,side:THREE.BackSide})));
  function box(w,h,x,y,z,I,tint){
    const m=new THREE.Mesh(new THREE.PlaneGeometry(w,h),new THREE.MeshBasicMaterial({side:THREE.DoubleSide}));
    m.material.color.setRGB(I*(tint?tint[0]:1),I*(tint?tint[1]:1),I*(tint?tint[2]:1));
    m.position.set(x,y,z);m.lookAt(0,1,0);es.add(m);return m;}
  box(18,26,0,22,0,9.5);            // big overhead softbox
  box(6,28,-20,9,0,6.5);            // side strip L (long highlight down the flank)
  box(6,28,20,9,0,6.5);             // side strip R
  box(20,5,0,5,-26,4.2,[1,0.92,0.82]);// warm rear strip
  box(16,4,0,3,28,3.2);             // front low fill
  box(4,12,-12,14,16,3.6,[0.85,0.92,1]);
  box(4,12,12,14,-16,3.6);
  const rt=pm.fromScene(es,0.025);pm.dispose();
  return rt.texture;
}

/* ---------- materials ---------- */
let R_PAINT=null,R_GLASS=null,R_FINISH='gloss';
function R_flakeMap(){
  if(R_flakeMap.t) return R_flakeMap.t;
  const c=R_canvas(512,512),g=c.getContext('2d'),id=g.createImageData(512,512);
  for(let i=0;i<id.data.length;i+=4){id.data[i]=128+(Math.random()-0.5)*90;id.data[i+1]=128+(Math.random()-0.5)*90;id.data[i+2]=255;id.data[i+3]=255;}
  g.putImageData(id,0,0);
  const t=R_tex(c,false,[7,7]);R_flakeMap.t=t;return t;
}
function R_applyFinish(){
  if(!R_PAINT) return;
  const f=R_FINISH,m=R_PAINT;
  if(f==='gloss'){m.metalness=0.55;m.roughness=0.30;m.clearcoat=1;m.clearcoatRoughness=0.03;m.envMapIntensity=1.7;m.normalScale.set(0.18,0.18);}
  if(f==='satin'){m.metalness=0.45;m.roughness=0.5;m.clearcoat=0.35;m.clearcoatRoughness=0.35;m.envMapIntensity=0.9;m.normalScale.set(0.1,0.1);}
  if(f==='matte'){m.metalness=0.2;m.roughness=0.88;m.clearcoat=0;m.clearcoatRoughness=0.6;m.envMapIntensity=0.55;m.normalScale.set(0.04,0.04);}
  if(f==='chrome'){m.metalness=1;m.roughness=0.06;m.clearcoat=0;m.envMapIntensity=1.5;m.normalScale.set(0,0);}
  m.needsUpdate=true;
}
function R_ensurePaint(hex){
  if(!R_PAINT){
    R_PAINT=new THREE.MeshPhysicalMaterial({color:R_lin(hex),normalMap:R_flakeMap(),clearcoat:1});
    R_PAINT.userData.paint=true; R_applyFinish();
  } else R_PAINT.color.copy(R_lin(hex));
  return R_PAINT;
}
function carBodyMat(hex,xray){return R_ensurePaint(hex||currentColor.hex);}
function glassMat(xray){
  if(!R_GLASS){R_GLASS=new THREE.MeshPhysicalMaterial({color:new THREE.Color(0x020304),metalness:0,roughness:0.03,transparent:true,opacity:0.88,side:THREE.DoubleSide,depthWrite:false,envMapIntensity:0.75,clearcoat:1,clearcoatRoughness:0.02});}
  return R_GLASS;
}
const R_M={};
function R_mat(key,fn){return R_M[key]||(R_M[key]=fn());}
function chromeMat(){return R_mat('chrome',()=>new THREE.MeshStandardMaterial({color:R_lin('#e8eaee'),metalness:1,roughness:0.05,envMapIntensity:1.4}));}
function carbonMat(){return R_mat('carbon',()=>{
  const c=R_canvas(128,128),g=c.getContext('2d');g.fillStyle='#0b0b0d';g.fillRect(0,0,128,128);

function R_loftBuild(secFn,zs){

    let cx=0,cy=0;for(let j=0;j<nL;j++){cx+=P[si][j].x;cy+=P[si][j].y;}cx/=nL;cy/=nL;
    const cz=zs[si];const c0=base;pos.set([cx,cy,cz],c0*3);
    for(let j=0;j<nL;j++){const v=P[si][j];pos.set([v.x,v.y,v.z],(c0+1+j)*3);}
    for(let j=0;j<nL;j++){const j2=(j+1)%nL;if(dir>0)idx.push(c0,c0+1+j2,c0+1+j);else idx.push(c0,c0+1+j,c0+1+j2);}
    base+=nL+1;

  let flip=false;if(ntop.getY(mid+topj)<0){flip=true;const ia=geo.index.array;for(let t=0;t<ia.length;t+=3){const x=ia[t+1];ia[t+1]=ia[t+2];ia[t+2]=x;}geo.computeVertexNormals();}

}

  rows.forEach(r=>{for(let c=0;c<nc;c++){const q=r[Math.min(c,r.length-1)];pos.push(q[0],q[1],q[2]);}});

function R_tireGeo(wid,rIn,rOut){
  const pts=[],N=24;
  for(let i=0;i<=N;i++){
    const t=i/N;let r,a;
    if(t<0.3){const s=t/0.3;r=rIn+(rOut-0.012-rIn)*Math.pow(s,0.9);a=-wid/2*(0.80+0.20*Math.sin(s*R_PI/2));}
    else if(t<=0.7){const s=(t-0.3)/0.4;r=rOut-0.012*Math.pow(Math.abs(2*s-1),3)+0.0;a=-wid/2+wid*s;}
    else{const s=(t-0.7)/0.3;r=(rOut-0.012)-(rOut-0.012-rIn)*Math.pow(s,1.1);a=wid/2*(1-0.20*(1-Math.sin((1-s)*R_PI/2))); if(s>=0.999){a=wid/2*0.80;}}
    pts.push(new THREE.Vector2(r,a));
  }
  const g=new THREE.LatheGeometry(pts,72);g.rotateX(R_PI/2);return g;
}
function R_spokeGeo(rIn,rOut,wIn,wOut,depth,dish){

  const g=new THREE.ExtrudeGeometry(sh,{depth:depth,bevelEnabled:true,bevelThickness:0.004,bevelSize:0.004,bevelSegments:2});
  const p=g.attributes.position;
  for(let i=0;i<p.count;i++){const r=Math.hypot(p.getX(i),p.getY(i));p.setZ(i,p.getZ(i)+dish*Math.pow(Math.max(0,(r-rIn)/(rOut-rIn)),1.5));}
  g.computeVertexNormals();return g;
}

/* ================= v9: wheel width + deep dish + white-letter tires ================= */
(function(){
  if(typeof R_buildWheel!=='function'||typeof addWheels!=='function') return;

  // ---- state ----
  window.WHEEL_WIDTHS=[9.5,10,10.5,11,11.5,12];
  if(typeof window.wheelWidth!=='number') window.wheelWidth=10.5;   // inches, rear
  if(typeof window.wheelDeepDish==='undefined') window.wheelDeepDish=false;
  if(typeof window.tireLetters==='undefined') window.tireLetters='black'; // 'black' | 'white'

  // Honest fitment: widest rear wheel each body can take.
  // Narrow (standard) vs widebody. Front is always ~1.5" narrower than rear.
  window.WHEEL_MAXFIT=function(){
    const wide=isWidebody;
    const byKind={coupe:wide?12:10.5, sedan:wide?12:10.5, suv:11.5, c300:10.5};
    const k=(typeof R_CUR!=='undefined'&&R_CUR)?R_CUR.kind:'coupe';
    // c300 has no widebody kit; suv fender is fixed
    return byKind[k]||(wide?12:10.5);
  };
  window.WHEEL_FITS=function(w){return w<=window.WHEEL_MAXFIT()+1e-6;};

  // inches -> scene barrel width. OEM rear 10.5" ~ 0.325 widebody / 0.30 standard baseline.
  function widthScene(inches,rear,wide,dragR){
    // map 9.5..12 inch to a clearly visible barrel-width spread
    const base=rear?0.30:0.275;          // width at 10.5"
    const perInch=0.055;                 // scene units per inch of change (visible)
    let w=base+(inches-10.5)*perInch;
    if(dragR&&rear) w*=1.06;
    return Math.max(0.16,w);
  }

  // ---- deep-dish aware wheel (overrides R_buildWheel) ----
  const _origBuildWheel=R_buildWheel;
  R_buildWheel=function(o){
    const g=new THREE.Group();
    const rimR=o.rim||0.254;
    const dish=!!o.deepDish;
    const tire=new THREE.Mesh(R_tireGeo(o.wid,rimR-0.004,o.r),R_tireMaterial());tire.name='tire';g.add(tire);
    const wm=wheelMat(o.hex||'#9a9da3');
    // barrel: deep dish pushes the inner lip much deeper (more negative z) and keeps the face outboard
    const inset=dish?o.wid*0.62:o.wid*0.46;
    const bp=[new THREE.Vector2(rimR-0.012,-inset),new THREE.Vector2(rimR-0.014,-o.wid*0.1),new THREE.Vector2(rimR-0.028,o.wid*0.2),new THREE.Vector2(rimR-0.03,o.wid*0.42)];
    const barrel=new THREE.Mesh(new THREE.LatheGeometry(bp,48),new THREE.MeshStandardMaterial({color:0x2a2c30,metalness:0.9,roughness:0.5,side:THREE.DoubleSide}));
    barrel.rotateX(R_PI/2);barrel.name='rimbarrel';g.add(barrel);
    // outer lip: deep dish = a tall polished stepped lip set outboard
    const lipZ=o.wid*0.44;
    const lip=new THREE.Mesh(new THREE.TorusGeometry(rimR-0.002,dish?0.02:0.011,12,64),wm);lip.position.z=lipZ;lip.name='rim';g.add(lip);
    if(dish){ // second step lip for the stepped-dish look
      const lip2=new THREE.Mesh(new THREE.TorusGeometry(rimR-0.028,0.015,10,64),chromeMat());lip2.position.z=lipZ-0.028;lip2.name='rim';g.add(lip2);
    }
    const lipB=new THREE.Mesh(new THREE.TorusGeometry(rimR-0.002,0.011,10,64),wm);lipB.position.z=-inset;lipB.name='rim';g.add(lipB);
    // spokes: deep dish = spokes recessed inboard (concave), standard = near face
    const nSp=o.skinny?5:(dish?8:10);
    const faceZ=dish?o.wid*0.02:o.wid*0.18;
    const sp=R_spokeGeo(0.05,rimR-0.012,o.skinny?0.05:0.042,o.skinny?0.06:(dish?0.03:0.026),0.024,o.skinny?0.01:(dish?0.11:0.075));
    for(let i=0;i<nSp;i++){const m=new THREE.Mesh(sp,wm);m.rotation.z=i/nSp*R_PI*2;m.position.z=faceZ;m.name='rim';g.add(m);}
    const hub=new THREE.Mesh(new THREE.CylinderGeometry(0.075,0.085,0.04,32),wm);hub.rotation.x=R_PI/2;hub.position.z=faceZ+0.012;hub.name='rim';g.add(hub);
    const cap=new THREE.Mesh(new THREE.CylinderGeometry(0.042,0.042,0.012,32),R_black());cap.rotation.x=R_PI/2;cap.position.z=faceZ+0.036;cap.name='center_cap';g.add(cap);
    const capR=new THREE.Mesh(new THREE.TorusGeometry(0.04,0.004,8,32),chromeMat());capR.position.z=faceZ+0.042;g.add(capR);
    for(let i=0;i<5;i++){const a=i/5*R_PI*2;const n=new THREE.Mesh(new THREE.CylinderGeometry(0.0115,0.0115,0.022,6),chromeMat());n.rotation.x=R_PI/2;n.position.set(Math.cos(a)*0.0575,Math.sin(a)*0.0575,faceZ+0.036);g.add(n);}
    // brake
    const rr=o.rear?0.172:0.196;
    const rotor=new THREE.Mesh(new THREE.CylinderGeometry(rr,rr,0.032,64),R_rotorMat());rotor.rotation.x=R_PI/2;rotor.position.z=-o.wid*0.05;rotor.name='rotor';g.add(rotor);
    const hat=new THREE.Mesh(new THREE.CylinderGeometry(0.075,0.075,0.05,32),new THREE.MeshStandardMaterial({color:0x1b1c1f,metalness:0.8,roughness:0.5}));hat.rotation.x=R_PI/2;hat.position.z=-o.wid*0.05+0.015;g.add(hat);
    const sh=new THREE.Shape(),a0=0.55,a1=1.55,ri=rr-0.075,ro=rr+0.012;
    sh.absarc(0,0,ro,a0,a1,false);sh.absarc(0,0,ri,a1,a0,true);
    const cal=new THREE.Mesh(new THREE.ExtrudeGeometry(sh,{depth:o.rear?0.07:0.088,bevelEnabled:true,bevelThickness:0.006,bevelSize:0.006,bevelSegments:2}),redMat());
    cal.position.z=-o.wid*0.05-(o.rear?0.035:0.044);cal.name='caliper';g.add(cal);
    const piston=new THREE.CylinderGeometry(0.014,0.014,0.01,16);
    for(let i=0;i<(o.rear?2:3);i++){const a=a0+0.14+i*(a1-a0-0.28)/Math.max(1,(o.rear?1:2));const pp=new THREE.Mesh(piston,new THREE.MeshStandardMaterial({color:0x8d9096,metalness:1,roughness:0.3}));pp.rotation.x=R_PI/2;pp.position.set(Math.cos(a)*(rr-0.04),Math.sin(a)*(rr-0.04),-o.wid*0.05+0.046);g.add(pp);}
    return g;
  };

  // ---- addWheels with width + deep dish (overrides) ----
  addWheels=function(g,opts){
    const wr=opts.wr||0.364,yoff=opts.yoffset||0;
    const wide=isWidebody;
    const hex=(PARTS_DATA.wheels.find(w=>w.id===activeParts.wheels)||{}).hexColor||'#8f9298';
    const skinny=(activeParts.wheels==='demon_skinny')||isDemonMode&&currentFamily==='demon';
    const dragR=activeParts.tires==='drag_radials';
    const dish=!!window.wheelDeepDish;
    // clamp requested rear width to what fits; front is rear-1.5"
    let rearIn=window.wheelWidth; const maxF=window.WHEEL_MAXFIT(); if(rearIn>maxF)rearIn=maxF;
    const frontIn=Math.max(8,rearIn-1.5);
    const defs=[[1,opts.rf,0],[-1,opts.rf,0],[1,-opts.rb,1],[-1,-opts.rb,1]];
    const nm={'1_0':'wheel_fl','-1_0':'wheel_fr','1_1':'wheel_rl','-1_1':'wheel_rr'};
    defs.forEach(([sx,z,rear])=>{
      const front=!rear;const sk=skinny&&front;
      const r=sk?0.322:wr;
      const inches=sk?4.5:(rear?rearIn:frontIn);
      const wid=sk?0.115:widthScene(inches,rear,wide,dragR);
      const wg=new THREE.Group();wg.name=nm[sx+'_'+rear];
      const w=R_buildWheel({r:r,wid:wid,rear:rear,skinny:sk,hex:sk?'#5a5c61':hex,rim:sk?0.215:wr*0.698,deepDish:sk?false:dish});
      w.rotation.y=sx>0?R_PI/2:-R_PI/2; wg.add(w);
      // track: push the wheel out as it gets wider so the tire sits at the fender, not inside the body
      const trackBase=opts.tw||(wr>0.4?0.84:0.80);
      const widthPush=(wid-0.30)*0.85;
      const x=(sk?0.84:trackBase+(wide?0.035:0)+Math.max(0,widthPush))*sx;
      wg.position.set(x,r+yoff,z);
      if(sk)wg.userData.skinny=true;
      g.add(wg);
    });
  };

  // ---- white-letter tire sidewall (overrides R_tireTex) ----
  const _origTireTex=R_tireTex;
  R_tireTex=function(label){
    const white=(window.tireLetters==='white');
    const c=R_canvas(1024,512),g=c.getContext('2d');
    g.fillStyle='#171718';g.fillRect(0,0,1024,512);
    for(let k=0;k<2;k++){const y0=k?512*0.72:512*0.04,y1=k?512*0.96:512*0.28;
      for(let i=0;i<260;i++){g.strokeStyle='rgba(255,255,255,'+(0.012+Math.random()*0.03)+')';const yy=y0+Math.random()*(y1-y0);g.beginPath();g.moveTo(0,yy);g.lineTo(1024,yy);g.stroke();}
      const y=(y0+y1)/2;
      // big brand name: white raised letters when selected, else subtle grey
      if(white){
        g.fillStyle='#f4f4f2';g.font='900 46px Arial';g.textBaseline='middle';
        g.shadowColor='rgba(0,0,0,0.6)';g.shadowBlur=3;g.shadowOffsetY=2;
        g.fillText(label,46,y);
        g.shadowColor='transparent';g.shadowBlur=0;g.shadowOffsetY=0;
      } else {
        g.fillStyle='rgba(200,200,200,0.78)';g.font='bold 34px Arial';g.textBaseline='middle';
        g.fillText(label,50,y);
      }
      g.fillStyle=white?'rgba(245,245,242,0.9)':'rgba(200,200,200,0.78)';g.font='bold 20px Arial';
      g.fillText('TREADWEAR 300  TRACTION AA  TEMPERATURE A  M+S',540,y-8);
      g.fillText('MADE IN USA   RADIAL TUBELESS  DOT',540,y+16);
    }
    g.fillStyle='#0b0b0c';g.fillRect(0,512*0.3,1024,512*0.4);
    for(let i=1;i<5;i++){g.fillStyle='#000';g.fillRect(0,512*(0.3+i*0.08)-3,1024,6);}
    for(let x=0;x<1024;x+=18){g.fillStyle='#000';g.fillRect(x,512*0.3,5,512*0.4);}
    g.fillStyle='rgba(255,255,255,0.03)';for(let i=0;i<3000;i++)g.fillRect(Math.random()*1024,Math.random()*512,1,1);
    return R_tex(c,true);
  };
  // make the tire material recache when letter style changes: fold style into the cache key
  const _origTireMaterial=R_tireMaterial;
  R_tireMaterial=function(){
    const l=R_tireLabel()+'|'+window.tireLetters;
    if(!R_TIRE_TEX||R_TIRE_LBL!==l){R_TIRE_TEX=R_tireTex(R_tireLabel());R_TIRE_LBL=l;}
    return new THREE.MeshStandardMaterial({map:R_TIRE_TEX,roughness:0.88,metalness:0,envMapIntensity:0.35});
  };

  // ---- apply helpers ----
  window.setWheelWidth=function(inches){window.wheelWidth=inches;buildCar(currentFamily);updateFitmentWarning();if(typeof updateRightPanel==='function')updateRightPanel();};
  window.toggleDeepDish=function(){window.wheelDeepDish=!window.wheelDeepDish;buildCar(currentFamily);updateFitmentWarning();if(typeof updateRightPanel==='function')updateRightPanel();};
  window.setTireLetters=function(mode){window.tireLetters=mode;R_TIRE_TEX=null;buildCar(currentFamily);if(typeof updateRightPanel==='function')updateRightPanel();};

  // ---- honest fitment warning (overrides) ----
  const _origFit=updateFitmentWarning;
  updateFitmentWarning=function(){
    const strip=document.getElementById('fstrip');if(!strip)return;
    const warnings=[];
    const maxF=window.WHEEL_MAXFIT();
    const req=window.wheelWidth;
    if(req>maxF){
      warnings.push({type:'warn',msg:`✕ ${req}" rear will not clear this body. Max is ${maxF}"${(R_CUR&&(R_CUR.kind==='coupe'||R_CUR.kind==='sedan')&&!isWidebody)?' - add widebody for up to 12"':''}. Running ${maxF}".`});
    } else {
      warnings.push({type:'ok',msg:`✓ ${req}" rear · 5×115 · ${isWidebody?'Widebody':'Standard'} fitment confirmed`});
    }
    if(window.wheelDeepDish)warnings.push({type:'ok',msg:'✓ Deep dish barrel'});
    if(window.tireLetters==='white')warnings.push({type:'ok',msg:'✓ Raised white-letter sidewall'});
    if(heightDrop===3&&activeParts.wheels==='stock_wheels')warnings.push({type:'ok',msg:'⚡ Air ride at maximum drop - slammed stance'});
    if(activeParts.wheels==='demon_skinny')warnings.push({type:'ok',msg:'✓ Demon Crate skinny fronts - Track Config active'});
    strip.innerHTML=warnings.map(w=>`<div class="fw ${w.type}">${w.msg}</div>`).join('');
  };
})();

/* ================= v9: pop sunroof + body-kit visuals ================= */
(function(){
  if(typeof R_build!=='function') return;

  // ---- state ----
  if(typeof window.sunroofOpen==='undefined') window.sunroofOpen=false; // target state
  window.SUNROOF_FAMS={challenger:1,charger:1,c300:1,trackhawk:1,demon:1};
  // body-kit toggles (independent of the Amazon exterior single-select)
  if(typeof window.kitLip==='undefined') window.kitLip=false;
  if(typeof window.kitDiffuser==='undefined') window.kitDiffuser=false;
  window.kitSpoiler=window.kitSpoiler||'none'; // 'none' | 'lip' | 'wing'

  let R_SUNROOF=null;      // {glass, recess, slide:0..1, group}
  let R_sunAnim=0;         // current animated 0..1

  // Build the sunroof assembly onto the current body. Called at end of R_build.
  function addSunroof(){
    R_SUNROOF=null;
    const V=R_CUR; if(!V) return;
    const fam=currentFamily;
    if(!window.SUNROOF_FAMS[fam]) return;
    const B=carGroup.userData.bodyG; if(!B) return;
    // sunroof sits over the front seats: pick a z near the front of the roof
    const zc=(fam==='trackhawk')?0.15:0.12;          // center of panel
    const halfLen=(fam==='trackhawk')?0.52:0.46;      // along z
    const halfW=0.40;                                 // across x
    const z0=zc+halfLen, z1=zc-halfLen;
    const roofY=z=>R_cbP(z,3);                        // roof top at z
    const grp=new THREE.Group();grp.name='sunroof';grp.userData.xr=0; // glass should respond to xray via material
    // recessed opening frame + dark headliner (so the pop is believable: a real cutout)
    const frameMat=new THREE.MeshStandardMaterial({color:0x111214,metalness:0.6,roughness:0.5});
    const wellMat=new THREE.MeshStandardMaterial({color:0x08080a,roughness:0.95,metalness:0,side:THREE.DoubleSide});
    // the well (hole lining) dropped a little below the roof skin
    const wy=roofY(zc);
    const well=new THREE.Mesh(new THREE.BoxGeometry(halfW*2,0.11,halfLen*2),wellMat);
    well.position.set(0,wy-0.055,zc);well.name='sunroof_well';grp.add(well);
    // frame lip around the opening
    [[0,halfLen],[0,-halfLen]].forEach(([x,z])=>{const b=new THREE.Mesh(new THREE.BoxGeometry(halfW*2+0.05,0.015,0.05),frameMat);b.position.set(x,wy+0.004,zc+z);grp.add(b);});
    [[halfW,0],[-halfW,0]].forEach(([x,z])=>{const b=new THREE.Mesh(new THREE.BoxGeometry(0.05,0.015,halfLen*2+0.05),frameMat);b.position.set(x,wy+0.004,zc+z);grp.add(b);});
    // the sliding/popping glass panel
    const glassMatSun=new THREE.MeshPhysicalMaterial({color:0x020304,metalness:0,roughness:0.04,transparent:true,opacity:0.55,side:THREE.DoubleSide,envMapIntensity:0.8,clearcoat:1,clearcoatRoughness:0.03});
    const panel=new THREE.Mesh(new THREE.BoxGeometry(halfW*2-0.02,0.012,halfLen*2-0.02),glassMatSun);
    panel.name='sunroof_glass';
    // pivot group so we can tilt the rear edge up (pop) then slide back
    const pivot=new THREE.Group();pivot.name='sunroof_pivot';
    pivot.position.set(0,wy+0.01,zc);
    panel.position.set(0,0,0);
    pivot.add(panel);
    grp.add(pivot);
    B.add(grp);
    R_SUNROOF={pivot:pivot,panel:panel,wy:wy,zc:zc,halfLen:halfLen,glassMat:glassMatSun,well:well};
    applySunroof(R_sunAnim);
  }

  // Apply a 0..1 open amount: 0..0.4 tilts the rear edge up (pop), 0.4..1 slides the panel back.
  function applySunroof(a){
    if(!R_SUNROOF)return;
    const {pivot,panel,halfLen}=R_SUNROOF;
    const tilt=Math.min(a/0.4,1);                 // 0..1 over first 40%
    const slide=Math.max(0,(a-0.4)/0.6);          // 0..1 over last 60%
    // tilt: raise the REAR edge of the panel (pop position). Rear is -z.
    pivot.rotation.x=-tilt*0.28;                   // rear edge lifts
    panel.position.y=tilt*0.03;
    // slide: move the panel rearward over the roof, lifting slightly to clear
    panel.position.z=-slide*(halfLen*1.7);
    panel.position.y=tilt*0.03+slide*0.05;
    // once sliding, drop the tilt back toward flat (real sunroofs lay flat to slide)
    if(slide>0)pivot.rotation.x=-0.28*(1-slide)-0.0;
  }

  // smooth animation hooked into the render loop
  (function hookAnim(){
    const _origAnimate=window.animate;
    if(typeof _origAnimate!=='function'){setTimeout(hookAnim,50);return;}
    window.animate=function(){
      // ease current toward target
      const target=window.sunroofOpen?1:0;
      if(Math.abs(R_sunAnim-target)>0.001){R_sunAnim+=(target-R_sunAnim)*0.14;applySunroof(R_sunAnim);}
      _origAnimate();
    };
  })();

  window.toggleSunroof=function(){
    if(!window.SUNROOF_FAMS[currentFamily]){if(typeof showToast==='function')showToast('No sunroof offered on this model');return;}
    window.sunroofOpen=!window.sunroofOpen;
    const btn=document.getElementById('sunroofBtn');if(btn)btn.classList.toggle('on',window.sunroofOpen);
    if(typeof showToast==='function')showToast(window.sunroofOpen?'Sunroof: popped and sliding open':'Sunroof: closing');
    if(typeof updateRightPanel==='function')updateRightPanel();
  };

  // ---- body-kit visuals (toggleable, preview the catalog parts on the car) ----
  function addBodyKit(){
    const V=R_CUR;if(!V)return;const B=carGroup.userData.bodyG;if(!B)return;
    const old=B.getObjectByName('bodykit');if(old)B.remove(old);
    const kit=new THREE.Group();kit.name='bodykit';
    const cf=carbonMat();
    // front lip splitter
    if(window.kitLip){
      const lip=new THREE.Mesh(new THREE.BoxGeometry(1.9,0.022,0.34),cf);
      lip.position.set(0,0.185,V.nose-0.02);lip.name='kit_lip';lip.userData.xr=1;kit.add(lip);
      [-1,1].forEach(sx=>{const can=new THREE.Mesh(new THREE.BoxGeometry(0.03,0.08,0.18),cf);can.position.set(sx*0.8,0.235,V.nose-0.1);kit.add(can);});
    }
    // rear diffuser
    if(window.kitDiffuser){
      const base=new THREE.Mesh(new THREE.BoxGeometry(1.5,0.14,0.34),cf);base.position.set(0,0.30,V.tail+0.12);base.name='kit_diffuser';base.userData.xr=1;kit.add(base);
      for(let i=-2;i<=2;i++){const fin=new THREE.Mesh(new THREE.BoxGeometry(0.03,0.16,0.30),cf);fin.position.set(i*0.3,0.30,V.tail+0.14);kit.add(fin);}
    }
    // spoiler styles
    if(window.kitSpoiler==='lip'){
      const wy=R_lbP(V.tail+0.14,2)+0.02;
      const s=new THREE.Mesh(new THREE.BoxGeometry(1.6,0.03,0.18),carBodyMat());s.position.set(0,wy,V.tail+0.14);s.rotation.x=-0.18;s.name='kit_spoiler';s.userData.xr=1;kit.add(s);
    } else if(window.kitSpoiler==='wing'){
      const wy=R_lbP(V.tail+0.12,2)+0.11;
      const w=new THREE.Mesh(new THREE.BoxGeometry(1.7,0.024,0.22),carBodyMat());w.position.set(0,wy,V.tail+0.08);w.rotation.x=-0.06;w.name='kit_spoiler';w.userData.xr=1;kit.add(w);
      [-1,1].forEach(sx=>{const p=new THREE.Mesh(new THREE.BoxGeometry(0.03,0.09,0.17),carBodyMat());p.position.set(sx*0.72,wy-0.055,V.tail+0.1);kit.add(p);});
    }
    kit.traverse(o=>{if(o.isMesh)o.castShadow=true;});
    B.add(kit);
  }

  window.toggleKitLip=function(){window.kitLip=!window.kitLip;addBodyKit();if(isXray)applyXray(true);if(typeof updateRightPanel==='function')updateRightPanel();};
  window.toggleKitDiffuser=function(){window.kitDiffuser=!window.kitDiffuser;addBodyKit();if(isXray)applyXray(true);if(typeof updateRightPanel==='function')updateRightPanel();};
  window.setKitSpoiler=function(v){window.kitSpoiler=(window.kitSpoiler===v)?'none':v;addBodyKit();if(isXray)applyXray(true);if(typeof updateRightPanel==='function')updateRightPanel();};

  // ---- hook sunroof + bodykit into every body build ----
  const _origBuild=R_build;
  R_build=function(col,key){
    _origBuild(col,key);
    try{addSunroof();}catch(e){console.error('sunroof '+e.message);}
    try{addBodyKit();}catch(e){console.error('bodykit '+e.message);}
  };

  // inject a SUNROOF header button next to the other tb controls
  (function addBtn(){
    const demon=document.getElementById('demonBtn');
    if(!demon){setTimeout(addBtn,60);return;}
    if(document.getElementById('sunroofBtn'))return;

  })();

})();

/* ================= v9: wheel width + deep dish + white-letter tires ================= */
(function(){
  if(typeof R_buildWheel!=='function'||typeof addWheels!=='function') return;

  // ---- state ----
  window.WHEEL_WIDTHS=[9.5,10,10.5,11,11.5,12];
  if(typeof window.wheelWidth!=='number') window.wheelWidth=10.5;   // inches, rear
  if(typeof window.wheelDeepDish==='undefined') window.wheelDeepDish=false;
  if(typeof window.tireLetters==='undefined') window.tireLetters='black'; // 'black' | 'white'

  // Honest fitment: widest rear wheel each body can take.
  // Narrow (standard) vs widebody. Front is always ~1.5" narrower than rear.
  window.WHEEL_MAXFIT=function(){
    const wide=isWidebody;
    const byKind={coupe:wide?12:10.5, sedan:wide?12:10.5, suv:11.5, c300:10.5};
    const k=(typeof R_CUR!=='undefined'&&R_CUR)?R_CUR.kind:'coupe';
    // c300 has no widebody kit; suv fender is fixed
    return byKind[k]||(wide?12:10.5);
  };
  window.WHEEL_FITS=function(w){return w<=window.WHEEL_MAXFIT()+1e-6;};

  // inches -> scene barrel width. OEM rear 10.5" ~ 0.325 widebody / 0.30 standard baseline.
  function widthScene(inches,rear,wide,dragR){
    // map 9.5..12 inch to a clearly visible barrel-width spread
    const base=rear?0.30:0.275;          // width at 10.5"
    const perInch=0.055;                 // scene units per inch of change (visible)
    let w=base+(inches-10.5)*perInch;
    if(dragR&&rear) w*=1.06;
    return Math.max(0.16,w);
  }

  // ---- deep-dish aware wheel (overrides R_buildWheel) ----
  const _origBuildWheel=R_buildWheel;
  R_buildWheel=function(o){
    const g=new THREE.Group();
    const rimR=o.rim||0.254;
    const dish=!!o.deepDish;
    const tire=new THREE.Mesh(R_tireGeo(o.wid,rimR-0.004,o.r),R_tireMaterial());tire.name='tire';g.add(tire);
    const wm=wheelMat(o.hex||'#9a9da3');
    // barrel: deep dish pushes the inner lip much deeper (more negative z) and keeps the face outboard
    const inset=dish?o.wid*0.62:o.wid*0.46;
    const bp=[new THREE.Vector2(rimR-0.012,-inset),new THREE.Vector2(rimR-0.014,-o.wid*0.1),new THREE.Vector2(rimR-0.028,o.wid*0.2),new THREE.Vector2(rimR-0.03,o.wid*0.42)];
    const barrel=new THREE.Mesh(new THREE.LatheGeometry(bp,48),new THREE.MeshStandardMaterial({color:0x2a2c30,metalness:0.9,roughness:0.5,side:THREE.DoubleSide}));
    barrel.rotateX(R_PI/2);barrel.name='rimbarrel';g.add(barrel);
    // outer lip: deep dish = a tall polished stepped lip set outboard
    const lipZ=o.wid*0.44;
    const lip=new THREE.Mesh(new THREE.TorusGeometry(rimR-0.002,dish?0.02:0.011,12,64),wm);lip.position.z=lipZ;lip.name='rim';g.add(lip);
    if(dish){ // second step lip for the stepped-dish look
      const lip2=new THREE.Mesh(new THREE.TorusGeometry(rimR-0.028,0.015,10,64),chromeMat());lip2.position.z=lipZ-0.028;lip2.name='rim';g.add(lip2);
    }
    const lipB=new THREE.Mesh(new THREE.TorusGeometry(rimR-0.002,0.011,10,64),wm);lipB.position.z=-inset;lipB.name='rim';g.add(lipB);
    // spokes: deep dish = spokes recessed inboard (concave), standard = near face
    const nSp=o.skinny?5:(dish?8:10);
    const faceZ=dish?o.wid*0.02:o.wid*0.18;
    const sp=R_spokeGeo(0.05,rimR-0.012,o.skinny?0.05:0.042,o.skinny?0.06:(dish?0.03:0.026),0.024,o.skinny?0.01:(dish?0.11:0.075));
    for(let i=0;i<nSp;i++){const m=new THREE.Mesh(sp,wm);m.rotation.z=i/nSp*R_PI*2;m.position.z=faceZ;m.name='rim';g.add(m);}
    const hub=new THREE.Mesh(new THREE.CylinderGeometry(0.075,0.085,0.04,32),wm);hub.rotation.x=R_PI/2;hub.position.z=faceZ+0.012;hub.name='rim';g.add(hub);
    const cap=new THREE.Mesh(new THREE.CylinderGeometry(0.042,0.042,0.012,32),R_black());cap.rotation.x=R_PI/2;cap.position.z=faceZ+0.036;cap.name='center_cap';g.add(cap);
    const capR=new THREE.Mesh(new THREE.TorusGeometry(0.04,0.004,8,32),chromeMat());capR.position.z=faceZ+0.042;g.add(capR);
    for(let i=0;i<5;i++){const a=i/5*R_PI*2;const n=new THREE.Mesh(new THREE.CylinderGeometry(0.0115,0.0115,0.022,6),chromeMat());n.rotation.x=R_PI/2;n.position.set(Math.cos(a)*0.0575,Math.sin(a)*0.0575,faceZ+0.036);g.add(n);}
    // brake
    const rr=o.rear?0.172:0.196;
    const rotor=new THREE.Mesh(new THREE.CylinderGeometry(rr,rr,0.032,64),R_rotorMat());rotor.rotation.x=R_PI/2;rotor.position.z=-o.wid*0.05;rotor.name='rotor';g.add(rotor);
    const hat=new THREE.Mesh(new THREE.CylinderGeometry(0.075,0.075,0.05,32),new THREE.MeshStandardMaterial({color:0x1b1c1f,metalness:0.8,roughness:0.5}));hat.rotation.x=R_PI/2;hat.position.z=-o.wid*0.05+0.015;g.add(hat);
    const sh=new THREE.Shape(),a0=0.55,a1=1.55,ri=rr-0.075,ro=rr+0.012;
    sh.absarc(0,0,ro,a0,a1,false);sh.absarc(0,0,ri,a1,a0,true);
    const cal=new THREE.Mesh(new THREE.ExtrudeGeometry(sh,{depth:o.rear?0.07:0.088,bevelEnabled:true,bevelThickness:0.006,bevelSize:0.006,bevelSegments:2}),redMat());
    cal.position.z=-o.wid*0.05-(o.rear?0.035:0.044);cal.name='caliper';g.add(cal);
    const piston=new THREE.CylinderGeometry(0.014,0.014,0.01,16);
    for(let i=0;i<(o.rear?2:3);i++){const a=a0+0.14+i*(a1-a0-0.28)/Math.max(1,(o.rear?1:2));const pp=new THREE.Mesh(piston,new THREE.MeshStandardMaterial({color:0x8d9096,metalness:1,roughness:0.3}));pp.rotation.x=R_PI/2;pp.position.set(Math.cos(a)*(rr-0.04),Math.sin(a)*(rr-0.04),-o.wid*0.05+0.046);g.add(pp);}
    return g;
  };

  // ---- addWheels with width + deep dish (overrides) ----
  addWheels=function(g,opts){
    const wr=opts.wr||0.364,yoff=opts.yoffset||0;
    const wide=isWidebody;
    const hex=(PARTS_DATA.wheels.find(w=>w.id===activeParts.wheels)||{}).hexColor||'#8f9298';
    const skinny=(activeParts.wheels==='demon_skinny')||isDemonMode&&currentFamily==='demon';
    const dragR=activeParts.tires==='drag_radials';
    const dish=!!window.wheelDeepDish;
    // clamp requested rear width to what fits; front is rear-1.5"
    let rearIn=window.wheelWidth; const maxF=window.WHEEL_MAXFIT(); if(rearIn>maxF)rearIn=maxF;
    const frontIn=Math.max(8,rearIn-1.5);
    const defs=[[1,opts.rf,0],[-1,opts.rf,0],[1,-opts.rb,1],[-1,-opts.rb,1]];
    const nm={'1_0':'wheel_fl','-1_0':'wheel_fr','1_1':'wheel_rl','-1_1':'wheel_rr'};
    defs.forEach(([sx,z,rear])=>{
      const front=!rear;const sk=skinny&&front;
      const r=sk?0.322:wr;
      const inches=sk?4.5:(rear?rearIn:frontIn);
      const wid=sk?0.115:widthScene(inches,rear,wide,dragR);
      const wg=new THREE.Group();wg.name=nm[sx+'_'+rear];
      const w=R_buildWheel({r:r,wid:wid,rear:rear,skinny:sk,hex:sk?'#5a5c61':hex,rim:sk?0.215:wr*0.698,deepDish:sk?false:dish});
      w.rotation.y=sx>0?R_PI/2:-R_PI/2; wg.add(w);
      // track: push the wheel out as it gets wider so the tire sits at the fender, not inside the body
      const trackBase=opts.tw||(wr>0.4?0.84:0.80);
      const widthPush=(wid-0.30)*0.85;
      const x=(sk?0.84:trackBase+(wide?0.035:0)+Math.max(0,widthPush))*sx;
      wg.position.set(x,r+yoff,z);
      if(sk)wg.userData.skinny=true;
      g.add(wg);
    });
  };

  // ---- white-letter tire sidewall (overrides R_tireTex) ----
  const _origTireTex=R_tireTex;

      g.fillText('TREADWEAR 300  TRACTION AA  TEMPERATURE A  M+S',540,y-8);

    g.fillStyle='#0b0b0c';g.fillRect(0,512*0.3,1024,512*0.4);
    for(let i=1;i<5;i++){g.fillStyle='#000';g.fillRect(0,512*(0.3+i*0.08)-3,1024,6);}
    for(let x=0;x<1024;x+=18){g.fillStyle='#000';g.fillRect(x,512*0.3,5,512*0.4);}
    g.fillStyle='rgba(255,255,255,0.03)';for(let i=0;i<3000;i++)g.fillRect(Math.random()*1024,Math.random()*512,1,1);
    return R_tex(c,true);
  };
  // make the tire material recache when letter style changes: fold style into the cache key
  const _origTireMaterial=R_tireMaterial;
  R_tireMaterial=function(){
    const l=R_tireLabel()+'|'+window.tireLetters;
    if(!R_TIRE_TEX||R_TIRE_LBL!==l){R_TIRE_TEX=R_tireTex(R_tireLabel());R_TIRE_LBL=l;}
    return new THREE.MeshStandardMaterial({map:R_TIRE_TEX,roughness:0.88,metalness:0,envMapIntensity:0.35});
  };

  // ---- apply helpers ----
  window.setWheelWidth=function(inches){window.wheelWidth=inches;buildCar(currentFamily);updateFitmentWarning();if(typeof updateRightPanel==='function')updateRightPanel();};
  window.toggleDeepDish=function(){window.wheelDeepDish=!window.wheelDeepDish;buildCar(currentFamily);updateFitmentWarning();if(typeof updateRightPanel==='function')updateRightPanel();};
  window.setTireLetters=function(mode){window.tireLetters=mode;R_TIRE_TEX=null;buildCar(currentFamily);if(typeof updateRightPanel==='function')updateRightPanel();};

  // ---- honest fitment warning (overrides) ----
  const _origFit=updateFitmentWarning;
  updateFitmentWarning=function(){
    const strip=document.getElementById('fstrip');if(!strip)return;
    const warnings=[];
    const maxF=window.WHEEL_MAXFIT();

    } else {

    if(activeParts.wheels==='demon_skinny')warnings.push({type:'ok',msg:'✓ Demon Crate skinny fronts. Track Config active'});
