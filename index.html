<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name='impact-site-verification' value='cc214b1f-31f1-433f-94a0-ec193a25801b' />
  <title>BlowerBuildz — Supercharged Mopar Configurator</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@400;500;600;700&family=Inter:wght@300;400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" />
  <style>
    :root {
      --bg:       #0A0A0C;
      --s1:       #131316;
      --s2:       #1C1D21;
      --s3:       #26272D;
      --s4:       #2E3038;
      --chrome:   #D4D7DC;
      --dim:      #B8BCC2;
      --muted:    #6B7280;
      --accent:   #CC0000;
      --amber:    #F2A900;
      --green:    #22C55E;
      --blue:     #38BDF8;
      --white:    #FFFFFF;
    }
    *,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
    html,body{background:var(--bg);color:var(--chrome);font-family:'Inter',sans-serif;height:100%;overflow:hidden;}

    /* ── HEADER ── */
    header{display:flex;align-items:center;justify-content:space-between;padding:0 20px;height:48px;background:var(--s1);border-bottom:1px solid var(--s3);flex-shrink:0;}
    .wordmark{font-family:'Rajdhani',sans-serif;font-weight:700;font-size:17px;letter-spacing:.10em;color:var(--white);display:flex;align-items:center;gap:9px;}
    .wordmark .dot{width:7px;height:7px;border-radius:50%;background:var(--accent);box-shadow:0 0 7px var(--accent);flex-shrink:0;}
    .hdr-badge{font-family:'JetBrains Mono',monospace;font-size:10px;color:var(--amber);border:1px solid rgba(242,169,0,.45);padding:2px 7px;border-radius:3px;letter-spacing:.06em;}
    .hdr-right{font-family:'JetBrains Mono',monospace;font-size:10px;color:var(--muted);letter-spacing:.04em;}

    /* ── LAYOUT ROOT ── */
    .root{display:flex;flex-direction:column;height:calc(100vh - 48px);}

    /* ── FAMILY NAV ── */
    .fnav{display:flex;align-items:center;background:var(--s1);border-bottom:1px solid var(--s3);padding:0 16px;flex-shrink:0;gap:2px;}
    .fnav-tab{font-family:'Rajdhani',sans-serif;font-weight:600;font-size:13px;letter-spacing:.08em;color:var(--muted);padding:11px 14px 10px;cursor:pointer;border-bottom:2px solid transparent;margin-bottom:-1px;transition:color .15s,border-color .15s;white-space:nowrap;background:none;border-top:none;border-left:none;border-right:none;}
    .fnav-tab:hover{color:var(--dim);}
    .fnav-tab.active{color:var(--accent);border-bottom-color:var(--accent);}

    /* ── CONTENT AREA ── */
    .content{display:flex;flex:1;overflow:hidden;}

    /* ── LEFT SIDEBAR ── */
    .lsidebar{width:200px;flex-shrink:0;background:var(--s1);border-right:1px solid var(--s3);display:flex;flex-direction:column;overflow-y:auto;}
    .sb-label{font-family:'Rajdhani',sans-serif;font-size:10px;font-weight:600;letter-spacing:.14em;color:var(--muted);text-transform:uppercase;padding:14px 13px 7px;}
    .year-btn{display:flex;align-items:center;justify-content:space-between;width:100%;padding:7px 13px;background:none;border:none;cursor:pointer;color:var(--dim);font-family:'JetBrains Mono',monospace;font-size:12px;transition:background .1s,color .1s;text-align:left;}
    .year-btn:hover{background:var(--s2);}
    .year-btn.active{background:var(--s3);color:var(--white);}
    .ybadge{font-size:9px;padding:1px 5px;border-radius:2px;font-family:'JetBrains Mono',monospace;}
    .ybadge.has3d{background:rgba(34,197,94,.12);color:var(--green);border:1px solid rgba(34,197,94,.28);}
    .ybadge.nomodel{background:rgba(107,114,128,.12);color:var(--muted);border:1px solid rgba(107,114,128,.25);}
    .vbtn{display:block;width:100%;padding:5px 13px 5px 24px;background:none;border:none;cursor:pointer;color:var(--muted);font-size:11px;transition:background .1s,color .1s;text-align:left;}
    .vbtn:hover{background:var(--s2);color:var(--dim);}
    .vbtn.active{background:rgba(232,71,42,.08);color:var(--accent);}
    .sb-rule{border:none;border-top:1px dashed rgba(107,114,128,.2);margin:7px 13px;}

    /* ── MAIN COLUMN ── */
    .main{flex:1;display:flex;flex-direction:column;overflow:hidden;}

    /* TITLE BAR */
    .vtitle{padding:10px 18px 9px;background:var(--s1);border-bottom:1px solid var(--s3);display:flex;align-items:baseline;gap:12px;flex-shrink:0;}
    .vtitle h1{font-family:'Rajdhani',sans-serif;font-size:21px;font-weight:700;letter-spacing:.07em;color:var(--white);line-height:1;}
    .chip{font-family:'JetBrains Mono',monospace;font-size:10px;padding:2px 7px;border-radius:3px;}
    .chip.year{color:var(--amber);border:1px solid rgba(242,169,0,.4);}
    .chip.hp{color:var(--accent);border:1px solid rgba(232,71,42,.4);}
    .chip.model{color:var(--green);border:1px solid rgba(34,197,94,.3);}

    /* UPPER SPLIT: viewer + right spec panel */
    .upper{display:flex;flex:1;overflow:hidden;min-height:0;}
    .viewer-panel{flex:1;position:relative;background:var(--bg);display:flex;align-items:center;justify-content:center;overflow:hidden;}
    .viewer-panel iframe{width:100%;height:100%;border:none;display:block;}

    /* SPEC CARD (no model) */
    .spec-card{width:100%;height:100%;display:flex;flex-direction:column;align-items:center;justify-content:flex-start;padding:24px 28px;overflow-y:auto;gap:0;}
    .sc-hero{text-align:center;margin-bottom:20px;}
    .sc-icon{font-size:44px;display:block;margin-bottom:10px;}
    .sc-hero h2{font-family:'Rajdhani',sans-serif;font-size:26px;font-weight:700;color:var(--white);letter-spacing:.08em;}
    .sc-hero p{color:var(--muted);font-size:11px;margin-top:5px;font-family:'JetBrains Mono',monospace;}
    .stat-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;width:100%;max-width:560px;margin-bottom:18px;}
    .stat-block{background:var(--s2);border:1px solid var(--s3);border-radius:5px;padding:12px 10px;text-align:center;}
    .stat-num{font-family:'JetBrains Mono',monospace;font-size:20px;font-weight:500;color:var(--accent);line-height:1;}
    .stat-num.amber{color:var(--amber);}
    .stat-num.chrome{color:var(--chrome);}
    .stat-lbl{font-size:9px;color:var(--muted);text-transform:uppercase;letter-spacing:.10em;margin-top:4px;}
    .detail-table{width:100%;max-width:560px;border-collapse:collapse;margin-bottom:16px;}
    .detail-table tr{border-bottom:1px solid var(--s3);}
    .detail-table td{padding:7px 0;font-size:11px;}
    .detail-table td:first-child{color:var(--muted);width:40%;}
    .detail-table td:last-child{font-family:'JetBrains Mono',monospace;color:var(--chrome);text-align:right;}
    .special-note{width:100%;max-width:560px;background:rgba(242,169,0,.07);border:1px solid rgba(242,169,0,.22);border-radius:5px;padding:10px 12px;font-size:10px;color:var(--amber);line-height:1.5;}
    .perf-bars{width:100%;max-width:560px;margin-top:14px;}
    .pbar-row{display:flex;align-items:center;gap:9px;margin-bottom:7px;}
    .pbar-lbl{font-family:'JetBrains Mono',monospace;font-size:9px;color:var(--muted);width:48px;text-align:right;flex-shrink:0;}
    .pbar-track{flex:1;height:4px;background:var(--s3);border-radius:2px;overflow:hidden;}
    .pbar-fill{height:100%;border-radius:2px;background:var(--accent);transition:width .5s ease;}
    .pbar-fill.amber{background:var(--amber);}
    .pbar-val{font-family:'JetBrains Mono',monospace;font-size:9px;color:var(--dim);width:64px;flex-shrink:0;}

    /* RIGHT SPEC SIDEBAR */
    .rsidebar{width:188px;flex-shrink:0;background:var(--s1);border-left:1px solid var(--s3);overflow-y:auto;}
    .rs-sec{padding:11px 0 6px;}
    .rs-lbl{font-family:'Rajdhani',sans-serif;font-size:10px;font-weight:600;letter-spacing:.14em;color:var(--muted);text-transform:uppercase;padding:0 12px 5px;}
    .rs-rule{border:none;border-top:1px dashed rgba(107,114,128,.2);margin:0 12px 6px;}
    .rs-row{display:flex;justify-content:space-between;align-items:baseline;padding:3px 12px;}
    .rs-k{font-size:10px;color:var(--muted);}
    .rs-v{font-family:'JetBrains Mono',monospace;font-size:10px;color:var(--chrome);text-align:right;max-width:105px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
    .rs-v.accent{color:var(--accent);}
    .rs-v.amber{color:var(--amber);}

    /* ── PARTS CONFIGURATOR PANEL ── */
    .parts-panel{
      flex-shrink:0;
      background:var(--s1);
      border-top:1px solid var(--s3);
      display:flex;
      flex-direction:column;
      height:260px;
    }

    /* Parts panel header + category tabs */
    .pp-header{display:flex;align-items:center;gap:0;border-bottom:1px solid var(--s3);padding:0 14px;flex-shrink:0;}
    .pp-title{font-family:'Rajdhani',sans-serif;font-weight:700;font-size:12px;letter-spacing:.12em;color:var(--white);padding:9px 14px 9px 0;border-right:1px solid var(--s3);margin-right:10px;white-space:nowrap;}
    .cat-tab{font-family:'Rajdhani',sans-serif;font-size:11px;font-weight:600;letter-spacing:.07em;color:var(--muted);padding:9px 11px 8px;cursor:pointer;border-bottom:2px solid transparent;margin-bottom:-1px;transition:color .15s,border-color .15s;background:none;border-top:none;border-left:none;border-right:none;white-space:nowrap;}
    .cat-tab:hover{color:var(--dim);}
    .cat-tab.active{color:var(--amber);border-bottom-color:var(--amber);}

    /* Parts grid */
    .pp-body{flex:1;overflow-x:auto;overflow-y:hidden;padding:10px 14px;}
    .parts-grid{display:flex;gap:10px;height:100%;}

    /* Part card */
    .part-card{
      flex-shrink:0;
      width:220px;
      background:var(--s2);
      border:1px solid var(--s3);
      border-radius:6px;
      display:flex;
      flex-direction:column;
      overflow:hidden;
      transition:border-color .15s;
      cursor:pointer;
    }
    .part-card:hover{border-color:var(--s4);}
    .part-card.selected{border-color:var(--amber);}

    .pc-top{padding:9px 10px 7px;border-bottom:1px solid var(--s3);}
    .pc-name{font-family:'Rajdhani',sans-serif;font-weight:600;font-size:12px;letter-spacing:.05em;color:var(--white);line-height:1.2;margin-bottom:3px;}
    .pc-brand{font-size:10px;color:var(--muted);}

    /* Stock vs aftermarket split */
    .pc-compare{display:flex;flex:1;overflow:hidden;}
    .pc-col{flex:1;padding:8px 9px;display:flex;flex-direction:column;gap:4px;}
    .pc-col:first-child{border-right:1px solid var(--s3);}
    .pc-col-lbl{font-size:9px;font-weight:600;letter-spacing:.10em;text-transform:uppercase;color:var(--muted);margin-bottom:2px;}
    .pc-col-lbl.am{color:var(--amber);}
    .pc-stat-row{display:flex;justify-content:space-between;font-size:10px;}
    .pc-stat-key{color:var(--muted);}
    .pc-stat-val{font-family:'JetBrains Mono',monospace;color:var(--chrome);}
    .pc-stat-val.better{color:var(--green);}
    .pc-delta{display:flex;align-items:center;gap:4px;margin-top:4px;}
    .pc-delta-badge{font-family:'JetBrains Mono',monospace;font-size:9px;background:rgba(34,197,94,.12);color:var(--green);border:1px solid rgba(34,197,94,.3);padding:1px 5px;border-radius:2px;}
    .pc-delta-badge.hp{background:rgba(232,71,42,.12);color:var(--accent);border-color:rgba(232,71,42,.3);}
    .pc-delta-badge.amber{background:rgba(242,169,0,.12);color:var(--amber);border-color:rgba(242,169,0,.3);}

    .pc-footer{padding:7px 9px;border-top:1px solid var(--s3);display:flex;align-items:center;justify-content:space-between;flex-shrink:0;}
    .pc-price{font-family:'JetBrains Mono',monospace;font-size:11px;color:var(--amber);}
    .buy-btn{font-family:'Rajdhani',sans-serif;font-size:11px;font-weight:600;letter-spacing:.06em;background:var(--accent);color:var(--white);border:none;border-radius:3px;padding:4px 10px;cursor:pointer;transition:background .15s;text-decoration:none;display:inline-block;}
    .buy-btn:hover{background:#d13d22;}

    /* Perf delta bar in parts panel */
    .pp-delta-bar{margin-top:6px;}
    .pp-dbar-track{width:100%;height:3px;background:var(--s3);border-radius:2px;overflow:hidden;margin-top:2px;}
    .pp-dbar-fill{height:100%;border-radius:2px;background:var(--accent);}

    /* ── ATTRIBUTION FOOTER ── */
    .attr-footer{background:var(--s1);border-top:1px solid var(--s3);padding:5px 16px;font-size:9px;font-family:'JetBrains Mono',monospace;color:var(--muted);flex-shrink:0;display:flex;align-items:center;justify-content:space-between;}

    /* ── SCROLLBAR ── */
    ::-webkit-scrollbar{width:4px;height:4px;}
    ::-webkit-scrollbar-track{background:transparent;}
    ::-webkit-scrollbar-thumb{background:var(--s3);border-radius:2px;}

    /* ── RESPONSIVE ── */
    @media(max-width:960px){.rsidebar{display:none;}}
    @media(max-width:720px){
      .lsidebar{width:160px;}
      .stat-grid{grid-template-columns:repeat(2,1fr);}
      .parts-panel{height:240px;}
    }
  </style>
  <meta name="description" content="BlowerBuildz — The only interactive 3D parts configurator built for supercharged Mopar platforms. Hellcat, Demon, Trackhawk, and more." />

/* =====================================================
   STATE
   ===================================================== */
let fam      = 'challenger';
let yr       = 2015;
let varId    = null;
let partCat  = 'engine';
let selPart  = null;

/* =====================================================
   HELPERS
   ===================================================== */
const getFD  = f => FAMILIES[f];
const getYD  = (f,y) => getFD(f).years.find(d => d.year===y);
const getVar = (f,y,id) => { const yd=getYD(f,y); if(!yd) return null; return id ? yd.variants.find(v=>v.id===id)||yd.variants[0] : yd.variants[0]; };
const numHp  = s => { if(!s) return 0; const m=(s+'').match(/(\d+)/); return m?parseInt(m[1]):0; };
const numTq  = s => { if(!s) return 0; const m=(s+'').replace(',','').match(/(\d+)/); return m?parseInt(m[1]):0; };
const numSpd = s => { if(!s) return 0; const m=(s+'').replace(',','').match(/(\d+)/); return m?parseInt(m[1]):0; };
const hasModel = (f,y) => { const yd=getYD(f,y); return yd&&yd.variants.some(v=>v.sketchfabId); };

/* =====================================================
   RENDER SIDEBAR
   ===================================================== */
function renderSidebar() {
  const fd = getFD(fam);
  const yd = getYD(fam, yr);
  let h = `<div class="sb-label">Model Year</div>`;
  fd.years.forEach(d => {
    const active = d.year===yr;
    const has3d  = hasModel(fam, d.year);
    h += `<button class="year-btn${active?' active':''}" onclick="selectYear(${d.year})">
            <span>${d.year}</span>
            <span class="ybadge ${has3d?'has3d':'nomodel'}">${has3d?'3D':'SPEC'}</span>
          </button>`;
    if (active && d.variants.length > 1) {
      d.variants.forEach(v => {
        const va = varId && varId===v.id;
        h += `<button class="vbtn${va?' active':''}" onclick="selectVariant('${v.id}')">${v.label}</button>`;
      });
    }
  });
  document.getElementById('lsidebar').innerHTML = h;
}

/* =====================================================
   RENDER VIEWER (3D embed or spec card)
   ===================================================== */
function renderViewer(v) {
  const s  = v.specs;
  const hp = numHp(s.hp), tq = numTq(s.tq), spd = numSpd(s.vmax);
  const hpPct  = Math.min(100, Math.round(hp/HP_MAX*100));
  const tqPct  = Math.min(100, Math.round(tq/TQ_MAX*100));
  const spdPct = Math.min(100, Math.round(spd/SPD_MAX*100));

  if (v.sketchfabId) {
    const url = `https://sketchfab.com/models/${v.sketchfabId}/embed?ui_theme=dark&ui_controls=1&ui_infos=0&ui_watermark=0&camera=0`;
    document.getElementById('viewerPanel').innerHTML =
      `<iframe src="${url}" allowfullscreen mozallowfullscreen="true" webkitallowfullscreen="true"
         allow="autoplay; fullscreen; xr-spatial-tracking" title="${v.label} 3D"></iframe>`;
    return;
  }

  let extras = '';
  if (s.body)    extras += `<tr><td>Body style</td><td>${s.body}</td></tr>`;
  if (s.qmile)   extras += `<tr><td>Quarter mile</td><td>${s.qmile}</td></tr>`;

  document.getElementById('viewerPanel').innerHTML = `
    <div class="spec-card">
      <div class="sc-hero">
        <span class="sc-icon">🏎</span>
        <h2>${v.label.toUpperCase()}</h2>
        <p>${s.engine} &nbsp;·&nbsp; ${s.prod||yr}</p>
      </div>
      <div class="stat-grid">
        <div class="stat-block"><div class="stat-num">${s.hp}</div><div class="stat-lbl">Horsepower</div></div>
        <div class="stat-block"><div class="stat-num amber">${s.tq}</div><div class="stat-lbl">Torque</div></div>
        <div class="stat-block"><div class="stat-num chrome">${s.z60}</div><div class="stat-lbl">0–60 mph</div></div>
        <div class="stat-block"><div class="stat-num chrome">${s.vmax}</div><div class="stat-lbl">Top Speed</div></div>
      </div>
      <table class="detail-table">
        <tr><td>Engine</td><td>${s.engine}</td></tr>
        <tr><td>Supercharger</td><td>${s.sc}</td></tr>
        <tr><td>Transmission</td><td>${s.trans}</td></tr>
        <tr><td>Curb weight</td><td>${s.weight}</td></tr>
        <tr><td>Launch MSRP</td><td>${s.msrp}</td></tr>
        ${extras}
      </table>
      ${s.special ? `<div class="special-note">${s.special}</div>` : ''}
      <div class="perf-bars">
        <div class="pbar-row">
          <span class="pbar-lbl">POWER</span>
          <div class="pbar-track"><div class="pbar-fill" style="width:${hpPct}%"></div></div>
          <span class="pbar-val">${s.hp} hp</span>
        </div>
        <div class="pbar-row">
          <span class="pbar-lbl">TORQUE</span>
          <div class="pbar-track"><div class="pbar-fill amber" style="width:${tqPct}%"></div></div>
          <span class="pbar-val">${s.tq}</span>
        </div>
        <div class="pbar-row">
          <span class="pbar-lbl">V-MAX</span>
          <div class="pbar-track"><div class="pbar-fill" style="width:${spdPct}%"></div></div>
          <span class="pbar-val">${s.vmax}</span>
        </div>
      </div>
    </div>`;
}

/* =====================================================
   RENDER RIGHT SPEC SIDEBAR
   ===================================================== */
function renderRightSidebar(v) {
  const s = v.specs;
  const rows = [
    ['HP',       s.hp,    'accent'],
    ['Torque',   s.tq,    'amber'],
    ['0–60',     s.z60,   ''],
    ['Top Speed',s.vmax,  ''],
    ['Engine',   s.engine,''],
    ['S/C',      s.sc,    ''],
    ['Trans',    s.trans, ''],
    ['Weight',   s.weight,''],
    ['MSRP',     s.msrp,  ''],
  ];
  if (s.body) rows.push(['Body', s.body, '']);
  if (s.qmile) rows.push(['¼ mile', s.qmile, '']);

  let h = `<div class="rs-sec"><div class="rs-lbl">Specifications</div><hr class="rs-rule">`;
  rows.forEach(([k,val,cls]) => {
    h += `<div class="rs-row"><span class="rs-k">${k}</span><span class="rs-v ${cls}" title="${val}">${val}</span></div>`;
  });
  h += `</div>`;
  if (v.sketchfabId) {
    h += `<div class="rs-sec"><hr class="rs-rule"><div class="rs-lbl">3D Model</div>
           <div class="rs-row"><span class="rs-k">Creator</span><span class="rs-v" title="${v.credit}">${v.credit}</span></div>
           <div class="rs-row"><span class="rs-k">License</span><span class="rs-v" title="${v.license}">${v.license}</span></div>
          </div>`;
  }
  document.getElementById('rsidebar').innerHTML = h;
}

/* =====================================================
   RENDER PARTS PANEL
   ===================================================== */
function renderParts() {
  const parts = PARTS[partCat] || [];
  let h = '';
  parts.forEach((p, i) => {
    const isSel = selPart===i;
    const gainCls = p.am.gain==='hp' ? 'hp' : p.am.gain==='amber' ? 'amber' : '';
    h += `<div class="part-card${isSel?' selected':''}" onclick="togglePart(${i})">
      <div class="pc-top">
        <div class="pc-name">${p.name}</div>
        <div class="pc-brand">${p.brand}</div>
      </div>
      <div class="pc-compare">
        <div class="pc-col">
          <div class="pc-col-lbl">STOCK</div>
          ${Object.entries(p.stock).filter(([k])=>k!=='notes').map(([k,v])=>`
            <div class="pc-stat-row"><span class="pc-stat-key">${k}</span><span class="pc-stat-val">${v}</span></div>`).join('')}
          <div class="pc-stat-row" style="margin-top:2px"><span class="pc-stat-key" style="font-size:9px;color:var(--muted)">${p.stock.notes}</span></div>
        </div>
        <div class="pc-col">
          <div class="pc-col-lbl am">AFTERMARKET</div>
          ${Object.entries(p.am).filter(([k])=>k!=='notes'&&k!=='delta'&&k!=='gain').map(([k,v])=>`
            <div class="pc-stat-row"><span class="pc-stat-key">${k}</span><span class="pc-stat-val better">${v}</span></div>`).join('')}
          <div class="pc-stat-row" style="margin-top:2px"><span class="pc-stat-key" style="font-size:9px;color:var(--muted)">${p.am.notes}</span></div>
          <div class="pc-delta">
            <span class="pc-delta-badge ${gainCls}">${p.am.delta}</span>
          </div>
        </div>
      </div>
      <div class="pc-footer">
        <span class="pc-price">${p.price}</span>
        <a class="buy-btn" href="${p.link}" target="_blank" rel="noopener">Buy Now ↗</a>
      </div>
    </div>`;
  });
  document.getElementById('partsGrid').innerHTML = h;
}

/* =====================================================
   FULL RENDER
   ===================================================== */
function renderAll() {
  const fd = getFD(fam);
  const v  = getVar(fam, yr, varId);
  if (!v) return;
  const s  = v.specs;

  // Header tag
  document.getElementById('hdrTag').textContent = `${fd.label.toUpperCase()} · ${yr}`;

  // Title bar
  document.getElementById('titleName').textContent = v.label.toUpperCase();
  document.getElementById('titleYear').textContent = yr;
  document.getElementById('titleHp').textContent   = numHp(s.hp) + 'HP';

  const modelChip = document.getElementById('titleModel');
  if (v.sketchfabId) { modelChip.classList.remove('hidden'); }
  else               { modelChip.classList.add('hidden'); }

  renderViewer(v);
  renderRightSidebar(v);
  renderSidebar();
  renderParts();

  // Attribution footer
  document.getElementById('attrText').textContent = v.sketchfabId
    ? `3D model: ${v.credit} — ${v.license}`
    : 'Spec card — no 3D model available for this variant · Green badge = 3D model available';
  document.getElementById('attrLic').textContent = v.sketchfabId
    ? 'sketchfab.com'
    : '';
}

/* =====================================================
   EVENT HANDLERS
   ===================================================== */
function selectFamily(f) {
  fam   = f;
  yr    = getFD(f).years[0].year;
  varId = null;
  selPart = null;
  document.querySelectorAll('.fnav-tab').forEach(b => b.classList.toggle('active', b.dataset.family===f));
  renderAll();
}

function selectYear(y) {
  yr    = y;
  varId = null;
  selPart = null;
  renderAll();
}

function selectVariant(id) {
  varId = id;
  selPart = null;
  renderAll();
}

function selectPartCat(cat) {
  partCat = cat;
  selPart = null;
  document.querySelectorAll('.cat-tab').forEach(b => b.classList.toggle('active', b.dataset.cat===cat));
  renderParts();
}

function togglePart(i) {
  selPart = selPart===i ? null : i;
  renderParts();
}

/* Family nav */
document.getElementById('familyNav').addEventListener('click', e => {
  const t = e.target.closest('.fnav-tab');
  if (t && t.dataset.family) selectFamily(t.dataset.family);
});

/* Parts category tabs */
document.querySelector('.pp-header').addEventListener('click', e => {
  const t = e.target.closest('.cat-tab');
  if (t && t.dataset.cat) selectPartCat(t.dataset.cat);
});

/* =====================================================
   INIT
   ===================================================== */
renderAll();
</script>
