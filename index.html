<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name='impact-site-verification' value='cc214b1f-31f1-433f-94a0-ec193a25801b'>
<title>HellcatBuilds — 3D Configurator</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r134/three.min.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@400;600;700&family=JetBrains+Mono:wght@400;500;700&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#0A0A0C;--bg2:#0f0f12;--bg3:#141418;
  --red:#E8472A;--red2:#c73a20;
  --amber:#F2A900;--amber2:#d4930a;
  --white:#f0f0f0;--dim:rgba(240,240,240,.55);--dim2:rgba(240,240,240,.28);
  --glass:rgba(255,255,255,.04);--glass2:rgba(255,255,255,.08);
  --border:rgba(255,255,255,.08);
  --glow-r:0 0 20px rgba(232,71,42,.4);--glow-a:0 0 18px rgba(242,169,0,.4);
  --fh:'Rajdhani',sans-serif;--fm:'JetBrains Mono',monospace;--fb:'Inter',sans-serif;
}
html,body{height:100%;overflow:hidden;background:var(--bg);color:var(--white);font-family:var(--fb)}

/* HERO */
#hero{position:fixed;inset:0;z-index:1000;display:flex;flex-direction:column;align-items:center;justify-content:center;background:#000;transition:opacity .65s,visibility .65s}
#hero.out{opacity:0;visibility:hidden;pointer-events:none}
#hbg{position:absolute;inset:0;background:url('https://static.wixstatic.com/media/345002_78cd89fa1fda4f4093999207fcb1d260~mv2.jpg') center/cover no-repeat;filter:brightness(.42) saturate(1.2)}
#hov{position:absolute;inset:0;background:rgba(0,0,0,.4)}
.hc{position:relative;z-index:2;text-align:center;max-width:800px;padding:24px}
.hlogo{font-family:var(--fh);font-size:clamp(2.8rem,7vw,5.4rem);font-weight:700;letter-spacing:.08em;color:var(--white);text-shadow:0 0 40px rgba(232,71,42,.7);margin-bottom:4px}
.hlogo b{color:var(--red)}
.htag{font-family:var(--fm);font-size:.88rem;color:var(--amber);letter-spacing:.3em;text-transform:uppercase;margin-bottom:32px}
.hchips{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin-bottom:40px}
.hchip{font-family:var(--fm);font-size:.7rem;letter-spacing:.15em;color:var(--dim);border:1px solid var(--border);padding:5px 14px;border-radius:3px}
.hcta{font-family:var(--fh);font-size:1.05rem;font-weight:700;letter-spacing:.12em;text-transform:uppercase;background:var(--red);color:#fff;border:none;padding:16px 52px;border-radius:4px;cursor:pointer;box-shadow:var(--glow-r);transition:all .2s}
.hcta:hover{background:var(--red2);transform:translateY(-2px);box-shadow:0 0 36px rgba(232,71,42,.65)}
.smoke{position:absolute;border-radius:50%;filter:blur(90px);animation:hdrift linear infinite;pointer-events:none}
@keyframes hdrift{0%{transform:translate(0,0) scale(1);opacity:.18}33%{transform:translate(30px,-25px) scale(1.1);opacity:.26}66%{transform:translate(-20px,18px) scale(.9);opacity:.14}100%{transform:translate(0,0) scale(1);opacity:.18}}

/* APP SHELL */
#app{position:fixed;inset:0;display:flex;flex-direction:column;opacity:0;transition:opacity .55s}
#app.vis{opacity:1}

/* HEADER */
#hdr{height:50px;background:rgba(10,10,12,.97);border-bottom:1px solid var(--border);display:flex;align-items:center;padding:0 14px;gap:10px;z-index:100;flex-shrink:0}
.hdr-logo{font-family:var(--fh);font-size:1.22rem;font-weight:700;color:var(--white);letter-spacing:.08em;white-space:nowrap;flex-shrink:0}
.hdr-logo span{color:var(--red)}
.hdr-nav{display:flex;gap:1px;flex:1;overflow-x:auto}
.nb{font-family:var(--fh);font-size:.8rem;font-weight:600;letter-spacing:.1em;text-transform:uppercase;background:none;border:none;color:var(--dim);padding:6px 11px;cursor:pointer;border-radius:3px;white-space:nowrap;transition:all .12s;position:relative}
.nb:hover{color:var(--white);background:var(--glass)}
.nb.on{color:var(--amber)}
.nb.on::after{content:'';position:absolute;bottom:-1px;left:8px;right:8px;height:2px;background:var(--amber)}
.hdr-tools{display:flex;gap:5px;align-items:center;flex-shrink:0}
.tb{font-family:var(--fm);font-size:.65rem;letter-spacing:.1em;text-transform:uppercase;background:var(--glass);border:1px solid var(--border);color:var(--dim);padding:5px 9px;border-radius:3px;cursor:pointer;transition:all .12s;white-space:nowrap}
.tb:hover{color:var(--white);border-color:var(--dim2)}
.tb.on{color:var(--amber);border-color:var(--amber);background:rgba(242,169,0,.08)}
.tb.ron{color:var(--red);border-color:var(--red);background:rgba(232,71,42,.08)}

/* MAIN */
#main{flex:1;display:flex;overflow:hidden;min-height:0}

/* LEFT PANEL */
#lp{width:176px;flex-shrink:0;background:var(--bg2);border-right:1px solid var(--border);display:flex;flex-direction:column;overflow-y:auto;overflow-x:hidden}
.lp-fam{padding:8px 8px 2px}
.lp-fl{font-family:var(--fm);font-size:.6rem;letter-spacing:.2em;text-transform:uppercase;color:var(--dim2);margin-bottom:5px;padding-left:4px}
.yb{display:flex;align-items:center;width:100%;background:none;border:none;color:var(--dim);font-family:var(--fm);font-size:.76rem;padding:4px 8px;cursor:pointer;border-radius:3px;transition:all .12s;text-align:left;gap:5px}
.yb:hover{background:var(--glass2);color:var(--white)}
.yb.on{background:rgba(242,169,0,.1);color:var(--amber)}
.ybadge{font-size:.56rem;letter-spacing:.07em;padding:1px 5px;border-radius:2px;flex-shrink:0}
.b3d{background:rgba(232,71,42,.18);color:var(--red);border:1px solid rgba(232,71,42,.3)}
.bsp{background:rgba(255,255,255,.05);color:var(--dim2);border:1px solid var(--border)}
.vb{display:block;width:100%;background:none;border:none;color:var(--dim2);font-family:var(--fb);font-size:.7rem;padding:2px 8px 2px 22px;cursor:pointer;border-radius:2px;transition:all .12s;text-align:left}
.vb:hover{color:var(--white);background:var(--glass)}
.vb.on{color:var(--white)}

/* VIEWER */
#vw{flex:1;position:relative;background:var(--bg);min-width:0;overflow:hidden}
#tc{display:block;width:100%;height:100%}

/* VIEW PRESETS */
#vpc{position:absolute;bottom:12px;left:50%;transform:translateX(-50%);display:flex;gap:3px;background:rgba(10,10,12,.85);border:1px solid var(--border);border-radius:4px;padding:4px}
.vpb{font-family:var(--fm);font-size:.58rem;letter-spacing:.07em;text-transform:uppercase;background:none;border:none;color:var(--dim);padding:5px 8px;border-radius:2px;cursor:pointer;transition:all .12s}
.vpb:hover{background:var(--glass2);color:var(--white)}
.vpb.on{background:rgba(242,169,0,.12);color:var(--amber)}

/* VEHICLE INFO */
#vi{position:absolute;top:10px;left:10px;z-index:10;background:rgba(10,10,12,.88);border:1px solid var(--border);border-radius:4px;padding:8px 12px;pointer-events:none}
.vi-n{font-family:var(--fh);font-size:1rem;font-weight:700;color:var(--white);line-height:1.2}
.vi-s{font-family:var(--fm);font-size:.65rem;color:var(--amber);letter-spacing:.07em;margin-top:2px}

/* ACTION BTNS overlay */
#abx{position:absolute;top:10px;right:10px;z-index:10;display:flex;flex-direction:column;gap:5px}
.ab{font-family:var(--fm);font-size:.62rem;letter-spacing:.1em;text-transform:uppercase;background:rgba(10,10,12,.9);border:1px solid var(--border);color:var(--dim);padding:6px 10px;border-radius:3px;cursor:pointer;transition:all .15s;text-align:center}
.ab:hover{color:var(--amber);border-color:var(--amber)}
.ab.red:hover{color:var(--red);border-color:var(--red)}

/* FITMENT STRIP */
#fstrip{position:absolute;bottom:52px;left:50%;transform:translateX(-50%);pointer-events:none;z-index:10;display:flex;flex-direction:column;gap:3px}
.fw{font-family:var(--fm);font-size:.68rem;padding:5px 14px;border-radius:3px;text-align:center;white-space:nowrap}
.fw.ok{background:rgba(74,222,128,.1);border:1px solid rgba(74,222,128,.3);color:#4ade80}
.fw.warn{background:rgba(248,113,113,.1);border:1px solid rgba(248,113,113,.35);color:#f87171}

/* ISOLATION OVERLAY */
#iso{position:absolute;inset:0;z-index:200;background:rgba(0,0,0,.82);display:flex;align-items:center;justify-content:center;gap:20px;opacity:0;pointer-events:none;transition:opacity .3s}
#iso.on{opacity:1;pointer-events:all}
#iso-canvas-wrap{position:relative;width:min(480px,55vw);height:min(380px,55vh);background:radial-gradient(ellipse at center,rgba(242,169,0,.07) 0%,rgba(10,10,12,.96) 70%);border:1px solid rgba(242,169,0,.2);border-radius:6px;overflow:hidden;flex-shrink:0}
#iso-canvas{display:block;width:100%;height:100%}
#iso-panel{width:200px;background:var(--bg2);border:1px solid var(--border);border-radius:5px;padding:14px;overflow-y:auto;max-height:380px;flex-shrink:0}
.ip-name{font-family:var(--fh);font-size:1.15rem;font-weight:700;color:var(--amber);margin-bottom:2px}
.ip-cat{font-family:var(--fm);font-size:.6rem;letter-spacing:.2em;color:var(--dim2);text-transform:uppercase;margin-bottom:10px}
.ip-desc{font-size:.75rem;color:var(--dim);line-height:1.5;margin-bottom:10px}
.ip-spec{display:flex;justify-content:space-between;padding:4px 0;border-bottom:1px solid var(--border);font-size:.7rem}
.ip-spec span:first-child{color:var(--dim2);font-family:var(--fm);font-size:.62rem;letter-spacing:.05em}
.ip-spec span:last-child{color:var(--white);font-family:var(--fm)}
.ip-hint{font-family:var(--fm);font-size:.6rem;color:var(--dim2);text-align:center;margin:10px 0}
.ip-buy{display:block;width:100%;margin-top:10px;padding:9px;background:var(--red);color:#fff;font-family:var(--fh);font-size:.85rem;font-weight:700;letter-spacing:.08em;text-transform:uppercase;text-align:center;text-decoration:none;border-radius:3px;border:none;cursor:pointer;transition:background .15s}
.ip-buy:hover{background:var(--red2)}
#iso-close{position:absolute;top:8px;right:8px;background:none;border:1px solid var(--border);color:var(--dim);width:26px;height:26px;border-radius:3px;cursor:pointer;font-size:.9rem;display:flex;align-items:center;justify-content:center;transition:all .15s;z-index:10}
#iso-close:hover{color:var(--white);border-color:var(--dim)}
.iso-hint{font-family:var(--fm);font-size:.6rem;letter-spacing:.1em;color:var(--dim2);text-align:center;margin-top:8px}

/* RIGHT PANEL */
#rp{width:296px;flex-shrink:0;background:var(--bg2);border-left:1px solid var(--border);display:flex;flex-direction:column;overflow:hidden}
.rp-tabs{display:flex;border-bottom:1px solid var(--border);overflow-x:auto;flex-shrink:0}
.rpt{font-family:var(--fm);font-size:.6rem;letter-spacing:.1em;text-transform:uppercase;background:none;border:none;color:var(--dim2);padding:8px 9px;cursor:pointer;white-space:nowrap;transition:all .12s;border-bottom:2px solid transparent;margin-bottom:-1px}
.rpt:hover{color:var(--white);background:var(--glass)}
.rpt.on{color:var(--amber);border-bottom-color:var(--amber)}
.rp-body{flex:1;overflow-y:auto;padding:10px}
.sh{font-family:var(--fh);font-size:.88rem;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--white);margin:10px 0 7px;border-left:3px solid var(--red);padding-left:7px}

/* Part cards */
.pc{background:var(--bg3);border:1px solid var(--border);border-radius:4px;padding:9px;margin-bottom:7px;cursor:pointer;transition:all .15s}
.pc:hover{border-color:var(--amber);background:rgba(242,169,0,.025)}
.pc.sel{border-color:var(--red);background:rgba(232,71,42,.055)}
.pc-n{font-family:var(--fh);font-size:.86rem;font-weight:600;color:var(--white);margin-bottom:2px}
.pc-br{font-family:var(--fm);font-size:.6rem;letter-spacing:.1em;color:var(--amber);text-transform:uppercase}
.pc-sp{font-size:.7rem;color:var(--dim);margin:3px 0;line-height:1.4}
.pc-d{font-family:var(--fm);font-size:.7rem;font-weight:700;color:#4ade80}
.pc-d.neg{color:#f87171}
.pc-foot{display:flex;justify-content:space-between;align-items:center;margin-top:5px}
.pc-pr{font-family:var(--fm);font-size:.8rem;font-weight:700;color:var(--amber)}
.buy-btn{font-family:var(--fm);font-size:.58rem;letter-spacing:.1em;text-transform:uppercase;padding:4px 8px;background:var(--red);color:#fff;border:none;border-radius:2px;cursor:pointer;text-decoration:none;display:inline-block;transition:background .15s}
.buy-btn:hover{background:var(--red2)}

/* Color grid */
.cgrid{display:grid;grid-template-columns:repeat(5,1fr);gap:6px;margin:8px 0}
.cs{aspect-ratio:1;border-radius:3px;cursor:pointer;border:2px solid transparent;transition:all .15s;position:relative}
.cs:hover,.cs.sel{border-color:var(--amber);transform:scale(1.06)}
.cs .ct{position:absolute;bottom:calc(100% + 4px);left:50%;transform:translateX(-50%);background:var(--bg);border:1px solid var(--border);color:var(--white);font-size:.58rem;padding:2px 6px;white-space:nowrap;border-radius:2px;opacity:0;pointer-events:none;transition:opacity .15s;font-family:var(--fm);z-index:5}
.cs:hover .ct{opacity:1}

/* Height slider */
.hslide-wrap{padding:8px 0}
.hslide-lbl{display:flex;justify-content:space-between;font-family:var(--fm);font-size:.7rem;color:var(--dim);margin-bottom:7px}
.hslide-lbl #hs-val{color:var(--amber);font-weight:700}
input[type=range].hslide{-webkit-appearance:none;width:100%;height:4px;background:linear-gradient(90deg,var(--red) 0%,var(--amber) 50%,#333 50%);border-radius:2px;outline:none;cursor:pointer}
input[type=range].hslide::-webkit-slider-thumb{-webkit-appearance:none;width:16px;height:16px;border-radius:50%;background:var(--amber);box-shadow:0 0 8px rgba(242,169,0,.6);cursor:pointer}

/* Spec row */
.srow{display:flex;justify-content:space-between;align-items:center;padding:4px 0;border-bottom:1px solid var(--border);font-size:.72rem}
.srow span:first-child{color:var(--dim2);font-family:var(--fm);font-size:.64rem;letter-spacing:.05em;text-transform:uppercase}
.srow span:last-child{color:var(--white);font-family:var(--fm)}

/* HP display */
.hp-big{font-family:var(--fh);font-size:2.2rem;font-weight:700;color:var(--amber);text-align:center;margin:6px 0;text-shadow:var(--glow-a)}
.hp-lbl{font-family:var(--fm);font-size:.62rem;letter-spacing:.2em;color:var(--dim2);text-transform:uppercase;text-align:center}

/* Toggle */
.tog-row{display:flex;align-items:center;gap:8px;padding:9px;background:rgba(232,71,42,.07);border:1px solid rgba(232,71,42,.22);border-radius:4px;margin:7px 0;cursor:pointer;transition:all .15s}
.tog-row:hover{background:rgba(232,71,42,.14)}
.tog-lbl{font-family:var(--fh);font-size:.85rem;font-weight:600;color:var(--red);flex:1}
.tog-sub{font-size:.66rem;color:var(--dim2);display:block}
.sw{width:34px;height:18px;border-radius:9px;background:#222;border:1px solid #444;position:relative;flex-shrink:0;transition:background .2s}
.sw::after{content:'';position:absolute;width:12px;height:12px;border-radius:50%;background:#555;top:2px;left:2px;transition:left .2s,background .2s}
.sw.on{background:rgba(232,71,42,.3);border-color:var(--red)}
.sw.on::after{left:18px;background:var(--red)}

/* Toast */
#toast{position:fixed;bottom:28px;left:50%;transform:translateX(-50%) translateY(60px);background:rgba(10,10,12,.96);border:1px solid var(--amber);color:var(--amber);font-family:var(--fm);font-size:.72rem;letter-spacing:.1em;padding:10px 22px;border-radius:4px;z-index:9999;transition:transform .3s ease,opacity .3s ease;opacity:0}
#toast.show{transform:translateX(-50%) translateY(0);opacity:1}

::-webkit-scrollbar{width:3px;height:3px}
::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{background:rgba(255,255,255,.1);border-radius:2px}
@media(max-width:900px){#lp{display:none}#rp{width:240px}}
</style>
</head>
<body>

<!-- HERO -->
<div id="hero">
  <div id="hbg"></div><div id="hov"></div>
  <div class="smoke" style="width:600px;height:400px;background:radial-gradient(circle,rgba(232,71,42,.22),transparent);top:10%;left:-10%;animation-duration:18s"></div>
  <div class="smoke" style="width:400px;height:300px;background:radial-gradient(circle,rgba(242,169,0,.15),transparent);bottom:15%;right:-5%;animation-duration:14s;animation-delay:-7s"></div>
  <div class="smoke" style="width:350px;height:250px;background:radial-gradient(circle,rgba(100,100,200,.1),transparent);top:40%;right:20%;animation-duration:22s;animation-delay:-3s"></div>
  <div class="hc">
    <div class="hlogo">HELLCAT<b>BUILDS</b></div>
    <div class="htag">Build it. Know it. Own it.</div>
    <div class="hchips">
      <div class="hchip">6 MODELS</div>
      <div class="hchip">50+ VARIANTS</div>
      <div class="hchip">IRON MAN X-RAY</div>
      <div class="hchip">FITMENT ENGINE</div>
      <div class="hchip">DRAG RACE SIM</div>
    </div>
    <button class="hcta" onclick="enterApp()">ENTER THE CONFIGURATOR</button>
  </div>
</div>

<!-- APP -->
<div id="app">
  <!-- HEADER -->
  <div id="hdr">
    <div class="hdr-logo">HELLCAT<span>BUILDS</span></div>
    <nav class="hdr-nav" id="famNav"></nav>
    <div class="hdr-tools">
      <button class="tb" id="xrayBtn" onclick="toggleXray()">X-RAY</button>
      <button class="tb" id="nightBtn" onclick="toggleNight()">NIGHT</button>
      <button class="tb" id="dragBtn" onclick="openDrag()">DRAG RACE</button>
      <button class="tb" id="demonBtn" onclick="toggleDemon()" style="display:none">DEMON MODE</button>
    </div>
  </div>
  <!-- MAIN -->
  <div id="main">
    <!-- LEFT -->
    <div id="lp" id="leftPanel"></div>
    <!-- VIEWER -->
    <div id="vw">
      <canvas id="tc"></canvas>
      <div id="vi">
        <div class="vi-n" id="viName">Select a Vehicle</div>
        <div class="vi-s" id="viSpec">—</div>
      </div>
      <div id="abx">
        <button class="ab" onclick="resetBuild()">↺ RESET STOCK</button>
        <button class="ab" onclick="saveBuild()">⬇ SAVE BUILD</button>
      </div>
      <div id="vpc">
        <button class="vpb on" onclick="setView('front')">FRONT</button>
        <button class="vpb" onclick="setView('rear')">REAR</button>
        <button class="vpb" onclick="setView('driver')">DRIVER</button>
        <button class="vpb" onclick="setView('pass')">PASS</button>
        <button class="vpb" onclick="setView('3qfront')">3/4 F</button>
        <button class="vpb" onclick="setView('3qrear')">3/4 R</button>
        <button class="vpb" onclick="setView('top')">TOP</button>
      </div>
      <div id="fstrip"></div>
      <!-- ISOLATION OVERLAY -->
      <div id="iso">
        <div id="iso-canvas-wrap">
          <canvas id="iso-canvas"></canvas>
          <button id="iso-close" onclick="closeIso()">✕</button>
          <div class="iso-hint">DRAG TO ROTATE • SCROLL TO ZOOM</div>
        </div>
        <div id="iso-panel">
          <div class="ip-name" id="ip-name">—</div>
          <div class="ip-cat" id="ip-cat">—</div>
          <div class="ip-desc" id="ip-desc"></div>
          <div id="ip-specs"></div>
          <a class="ip-buy" id="ip-buy" href="#" target="_blank" rel="noopener">VIEW ON AMAZON →</a>
        </div>
      </div>
    </div>
    <!-- RIGHT -->
    <div id="rp">
      <div class="rp-tabs" id="rpTabs"></div>
      <div class="rp-body" id="rpBody"></div>
    </div>
  </div>
</div>

<!-- DRAG RACE MODAL -->
<div id="dragModal" style="display:none;position:fixed;inset:0;background:rgba(0,0,0,.88);z-index:500;align-items:center;justify-content:center;flex-direction:column;gap:16px">
  <div style="background:var(--bg2);border:1px solid var(--border);border-radius:6px;padding:24px;max-width:580px;width:90%;max-height:80vh;overflow-y:auto">
    <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:16px">
      <div style="font-family:var(--fh);font-size:1.4rem;font-weight:700;color:var(--amber)">DRAG RACE SIMULATOR</div>
      <button onclick="closeDrag()" style="background:none;border:1px solid var(--border);color:var(--dim);width:28px;height:28px;border-radius:3px;cursor:pointer;font-size:.9rem">✕</button>
    </div>
    <div style="display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:16px">
      <div style="background:var(--bg3);border:1px solid var(--border);padding:12px;border-radius:4px">
        <div style="font-family:var(--fm);font-size:.62rem;letter-spacing:.2em;color:var(--dim2);text-transform:uppercase;margin-bottom:6px">MY BUILD</div>
        <div id="myBuildSpec" style="font-family:var(--fh);font-size:.9rem;color:var(--white)">—</div>
        <div style="margin-top:8px">

// CAMERA orbit state
let isDragging=false, lastMouse={x:0,y:0};
let camTheta=0, camPhi=0.25, camDist=7;
let camTarget={x:0,y:0.5,z:0};
let touchDist=0;

function setView(v){
  const presets={
    'front':  {theta:0,    phi:0.18, dist:7},
    'rear':   {theta:Math.PI, phi:0.18, dist:7},
    'driver': {theta:Math.PI*1.5, phi:0.22, dist:6},
    'pass':   {theta:Math.PI*0.5, phi:0.22, dist:6},
    '3qfront':{theta:-0.6, phi:0.28, dist:7.5},
    '3qrear': {theta:Math.PI+0.6, phi:0.28, dist:7.5},
    'top':    {theta:0, phi:1.15, dist:9}
  };
  const p=presets[v]||presets['front'];
  // Animate smoothly
  const t0=performance.now();
  const t0Theta=camTheta, t0Phi=camPhi, t0Dist=camDist;
  const dur=600;
  function lerp(a,b,t){return a+(b-a)*t;}
  function step(now){
    const t=Math.min((now-t0)/dur,1);
    const e=t<0.5?2*t*t:(1-Math.pow(-2*t+2,2)/2);
    camTheta=lerp(t0Theta,p.theta,e);
    camPhi=lerp(t0Phi,p.phi,e);
    camDist=lerp(t0Dist,p.dist,e);
    updateCamera();
    if(t<1) requestAnimationFrame(step);
  }
  requestAnimationFrame(step);
  document.querySelectorAll('.vpb').forEach(b=>b.classList.toggle('on',b.getAttribute('onclick')?.includes("'"+v+"'")));
}

function updateCamera(){
  const r=camDist;
  const x=r*Math.cos(camPhi)*Math.sin(camTheta)+camTarget.x;
  const y=r*Math.sin(camPhi)+camTarget.y;
  const z=r*Math.cos(camPhi)*Math.cos(camTheta)+camTarget.z;
  camera.position.set(x,y,z);
  camera.lookAt(camTarget.x,camTarget.y,camTarget.z);
}

function onMouseDown(e){if(e.target.closest('#iso')) return; isDragging=true;lastMouse={x:e.clientX,y:e.clientY}}
function onMouseUp(){isDragging=false}
function onMouseMove(e){
  if(!isDragging) return;
  const dx=e.clientX-lastMouse.x, dy=e.clientY-lastMouse.y;
  lastMouse={x:e.clientX,y:e.clientY};
  camTheta-=dx*0.006;
  camPhi=Math.max(0.05,Math.min(1.45,camPhi-dy*0.004));
  updateCamera();
}
function onWheel(e){
  e.preventDefault();
  camDist=Math.max(2,Math.min(18,camDist+e.deltaY*0.012));
  updateCamera();
}
let t0Touch={x:0,y:0};
function onTouchStart(e){
  if(e.touches.length===1){isDragging=true;t0Touch={x:e.touches[0].clientX,y:e.touches[0].clientY};lastMouse=t0Touch;}
  if(e.touches.length===2){const dx=e.touches[0].clientX-e.touches[1].clientX,dy=e.touches[0].clientY-e.touches[1].clientY;touchDist=Math.sqrt(dx*dx+dy*dy);}
}
function onTouchMove(e){
  e.preventDefault();
  if(e.touches.length===1&&isDragging){
    const dx=e.touches[0].clientX-lastMouse.x,dy=e.touches[0].clientY-lastMouse.y;
    lastMouse={x:e.touches[0].clientX,y:e.touches[0].clientY};
    camTheta-=dx*0.007;camPhi=Math.max(0.05,Math.min(1.45,camPhi-dy*0.005));updateCamera();
  }
  if(e.touches.length===2){
    const dx=e.touches[0].clientX-e.touches[1].clientX,dy=e.touches[0].clientY-e.touches[1].clientY;
    const d=Math.sqrt(dx*dx+dy*dy);
    camDist=Math.max(2,Math.min(18,camDist+(touchDist-d)*0.04));
    touchDist=d;updateCamera();
  }
}

function setupIsoControls(){
  const ic=document.getElementById('iso-canvas');
  ic.addEventListener('mousedown',e=>{isoDragging=true;isoLastMouse={x:e.clientX,y:e.clientY}});
  ic.addEventListener('mouseup',()=>{isoDragging=false});
  ic.addEventListener('mousemove',e=>{
    if(!isoDragging) return;
    const dx=e.clientX-isoLastMouse.x,dy=e.clientY-isoLastMouse.y;
    isoLastMouse={x:e.clientX,y:e.clientY};
    isoTheta+=dx*0.01; isoPhi=Math.max(-1.2,Math.min(1.2,isoPhi-dy*0.008));
    updateIsoCamera();
  });
  ic.addEventListener('wheel',e=>{
    e.preventDefault();
    const d=isoCamera.position.distanceTo(new THREE.Vector3(0,0,0));
    isoCamera.position.setLength(Math.max(1,Math.min(6,d+e.deltaY*0.01)));
  },{passive:false});
}
function updateIsoCamera(){
  const r=isoCamera.position.length();
  isoCamera.position.set(r*Math.cos(isoPhi)*Math.sin(isoTheta),r*Math.sin(isoPhi),r*Math.cos(isoPhi)*Math.cos(isoTheta));
  isoCamera.lookAt(0,0,0);
}

// ========== CAR BUILDER — procedural Three.js geometry ==========
// Each family gets a uniquely shaped car built from primitives
// with PBR materials. Parts are added as named child meshes.

const MAT_CACHE = {};
function getPBR(opts){
  const key=JSON.stringify(opts);
  if(MAT_CACHE[key]) return MAT_CACHE[key];
  const m=new THREE.MeshStandardMaterial(opts);
  MAT_CACHE[key]=m; return m;
}

function carBodyMat(hexColor, xray){
  const c=new THREE.Color(hexColor);
  return getPBR({color:c,metalness:0.72,roughness:0.14,envMapIntensity:1.2,
    transparent:xray,opacity:xray?0.18:1,side:xray?THREE.DoubleSide:THREE.FrontSide,
    depthWrite:!xray});
}
function glassMat(xray){
  return getPBR({color:0x112244,metalness:0.3,roughness:0.05,transparent:true,opacity:xray?0.06:0.35,
    side:THREE.DoubleSide,depthWrite:false});
}
function chromeMat(){return getPBR({color:0xcccccc,metalness:1,roughness:0.05});}
function tireMat(){return getPBR({color:0x111111,metalness:0,roughness:0.85});}
function wheelMat(hex){return getPBR({color:new THREE.Color(hex||'#aaaaaa'),metalness:0.8,roughness:0.2});}
function carbonMat(){return getPBR({color:0x0e0e12,metalness:0.2,roughness:0.6});}
function interiorMat(){return getPBR({color:0x1a0505,metalness:0,roughness:0.8});}
function redMat(){return getPBR({color:0xE8472A,metalness:0.5,roughness:0.3,emissive:0x300800,emissiveIntensity:0.3});}

// Shared geometry helpers
function box(w,h,d){return new THREE.BoxGeometry(w,h,d,2,2,2);}
function cyl(rt,rb,h,s){return new THREE.CylinderGeometry(rt,rb,h,s||24);}
function sph(r,ws,hs){return new THREE.SphereGeometry(r,ws||16,hs||12);}

function buildCar(family){
  while(carGroup.children.length) carGroup.remove(carGroup.children[0]);
  MAT_CACHE['_body']=null;

  const fam=FAMILIES[family];
  const col=currentColor.hex;

  switch(family){
    case 'challenger': buildChallenger(col); break;
    case 'charger':    buildCharger(col); break;
    case 'demon':      buildDemon(col); break;
    case 'trackhawk':  buildTrackhawk(col); break;
    case 'c300':       buildC300(col); break;
    default:           buildChallenger(col);
  }

  // Apply x-ray mode
  if(isXray) applyXray(true);

  // Apply height drop
  applyHeight(heightDrop);

  // Shadow
  carGroup.traverse(o=>{if(o.isMesh){o.castShadow=true;o.receiveShadow=true;}});
}

function addHeadlights(g, fz, fy, size){
  const lMat=new THREE.MeshStandardMaterial({color:0xffffff,emissive:0xffeedd,emissiveIntensity:0.8,roughness:0.05,metalness:0.2});
  const lGeo=new THREE.BoxGeometry(size.x,0.15,0.1);
  const ll=new THREE.Mesh(lGeo,lMat);ll.position.set(-size.x/2-0.15,fy,fz);ll.name='headlight_l';g.add(ll);
  const lr=new THREE.Mesh(lGeo,lMat);lr.position.set(size.x/2+0.15,fy,fz);lr.name='headlight_r';g.add(lr);
  // Inner halo rings
  [ll,lr].forEach((l,i)=>{
    const ring=new THREE.Mesh(new THREE.RingGeometry(0.05,0.08,16),new THREE.MeshStandardMaterial({color:0xffffff,emissive:0xffffff,emissiveIntensity:1.5,side:THREE.DoubleSide}));
    ring.position.set(0,0,0.06);l.add(ring);
  });
}

function addTaillights(g, rz, ry, size){
  const tMat=new THREE.MeshStandardMaterial({color:0xff2200,emissive:0xff1100,emissiveIntensity:1.0,roughness:0.2,metalness:0.1});
  const lMat=new THREE.MeshStandardMaterial({color:0xee4400,emissive:0xee2200,emissiveIntensity:0.8,roughness:0.2,metalness:0.1});
  const tGeo=new THREE.BoxGeometry(0.55,0.18,0.1);
  const tl=new THREE.Mesh(tGeo,tMat);tl.position.set(-0.65,ry||0.6,rz);tl.name='taillight_l';g.add(tl);
  const tr=new THREE.Mesh(tGeo,tMat);tr.position.set(0.65,ry||0.6,rz);tr.name='taillight_r';g.add(tr);
  // Sequential inner strips
  for(let i=0;i<3;i++){
    const strip=new THREE.Mesh(new THREE.BoxGeometry(0.08,0.1,0.06),lMat);
    strip.position.set(-0.18+i*0.18,0,0.06);
    tl.add(strip); const stripR=strip.clone(); tr.add(stripR);
  }
}

function addWheels(g, opts){
  const {rb,rf,h,wr,yoffset=0} = opts;
  const baseY=wr+(yoffset||0);
  const wm=wheelMat(activeParts.wheels?PARTS_DATA.wheels.find(w=>w.id===activeParts.wheels)?.hexColor:'#8a8a8a');
  const tm=tireMat();
  const positions=[
    {x:-h, z:rf,  name:'wheel_fr'},
    {x: h, z:rf,  name:'wheel_fl'},
    {x:-h, z:-rb, name:'wheel_rr'},
    {x: h, z:-rb, name:'wheel_rl'}
  ];
  positions.forEach(p=>{
    const wheelGroup=new THREE.Group();
    wheelGroup.name=p.name;
    wheelGroup.position.set(p.x,baseY,p.z);
    // Tire
    const tire=new THREE.Mesh(cyl(wr,wr,0.22,28),tm);
    tire.rotation.z=Math.PI/2; tire.name='tire';
    wheelGroup.add(tire);
    // Rim
    const rim=new THREE.Mesh(cyl(wr*0.7,wr*0.7,0.24,28),wm);
    rim.rotation.z=Math.PI/2; rim.name='rim';
    wheelGroup.add(rim);
    // Spokes (5 spokes)
    for(let i=0;i<5;i++){
      const angle=i*(Math.PI*2/5);
      const spoke=new THREE.Mesh(new THREE.BoxGeometry(0.04,wr*0.6,0.24),wm);
      spoke.rotation.set(0,0,angle);
      spoke.position.set(0,0,0);
      rim.add(spoke);
    }
    // Brake caliper (visible in front)
    const caliper=new THREE.Mesh(new THREE.BoxGeometry(0.08,0.12,0.18),redMat());
    caliper.position.set(0.04,wr*0.55,0); caliper.name='caliper'; wheelGroup.add(caliper);
    // Center cap
    const cap=new THREE.Mesh(new THREE.CylinderGeometry(0.06,0.06,0.04,16),chromeMat());
    cap.rotation.z=Math.PI/2; cap.name='center_cap'; wheelGroup.add(cap);
    g.add(wheelGroup);
  });
}

function applyXray(on){
  isXray=on;
  const col=currentColor.hex;
  carGroup.traverse(o=>{
    if(!o.isMesh) return;
    const n=o.name||'';
    // Body panels go transparent
    if(n==='body'||n==='roof'||n==='hood'||n.includes('fascia')||n.includes('door')||n.includes('sill')||n.includes('trunk')||n.includes('hood')){
      o.material=carBodyMat(col,on);
    }
    // Glass goes very transparent
    if(n.includes('glass')||n.includes('windshield')){
      o.material=glassMat(on);
    }
    // Internal parts become visible
    const internalNames=['engine','supercharger','headers','headers_r','front_coilover','front_coilover_r','rear_coilover','rear_coilover_r','sway_bar','brakes','subwoofer','dual_battery','driver_seat','obd_port'];
    if(internalNames.some(k=>n===k)){
      o.material=o.material.clone();
      o.material.transparent=true;
      o.material.opacity=on?0.85:0;
      o.material.depthWrite=!on;
    }
  });
}

function setBodyColor(hex){
  currentColor=OEM_COLORS.find(c=>c.hex===hex)||{hex,name:'Custom'};
  const newMat=carBodyMat(hex,isXray);
  carGroup.traverse(o=>{
    if(!o.isMesh) return;
    const n=o.name||'';
    if(n==='body'||n==='roof'||n==='hood'||n.includes('fascia')||n.includes('door')||n.includes('sill')||n.includes('trunk')){
      o.material=newMat;
    }
  });
}

function applyHeight(drop){
  heightDrop=drop;
  // Raise/lower entire carGroup except wheels
  const wheelNames=['wheel_fr','wheel_fl','wheel_rr','wheel_rl'];
  const baseY=-drop*0.088;
  carGroup.traverse(o=>{
    if(wheelNames.includes(o.name)) return;
    if(o===carGroup) return;
  });
  // Move body lower (shift group down)
  carGroup.position.y=baseY;
  // Update fitment UI
  updateFitmentWarning();
}

function applyWheels(partId){
  activeParts.wheels=partId;
  const part=PARTS_DATA.wheels.find(w=>w.id===partId);
  const hex=part?.hexColor||'#888888';
  const wMat=wheelMat(hex);
  carGroup.traverse(o=>{
    if(o.name==='rim'){o.material=wMat;}
    if(o.name==='center_cap'){o.material=wMat;}
  });
  // Rebuild wheels for skinny demon special
  if(partId==='demon_skinny'){
    addSkinnyFronts(carGroup, 1.88);
  }
  updateFitmentWarning();
}

function updateFitmentWarning(){
  const strip=document.getElementById('fstrip');
  if(!strip) return;
  const rules=isWidebody?FITMENT_RULES.widebody:FITMENT_RULES.standard;
  const warnings=[];
  if(heightDrop===3 && activeParts.wheels==='stock_wheels'){
    warnings.push({type:'ok',msg:'⚡ Air ride at maximum drop — slammed stance'});
  }
  if(activeParts.wheels==='demon_skinny'){
    warnings.push({type:'ok',msg:'✓ Demon Crate skinny fronts — Track Config active'});
  }
  const wPart=PARTS_DATA.wheels.find(w=>w.id===activeParts.wheels);
  if(wPart && !wPart.demonOnly){
    warnings.push({type:'ok',msg:`✓ 5×115 · ${isWidebody?'Widebody':'Standard'} fitment confirmed`});
  }
  strip.innerHTML=warnings.map(w=>`<div class="fw ${w.type}">${w.msg}</div>`).join('');
}

function openIso(partId){
  const part=XRAY_PARTS.find(p=>p.id===partId);
  if(!part) return;
  isoPartId=partId;
  // Build isolation model
  while(isoGroup.children.length) isoGroup.remove(isoGroup.children[0]);
  const builder=ISO_PARTS_3D[partId];
  if(builder) builder(isoGroup);
  else buildIsoGeneric(isoGroup, partId);
  // Reset camera
  isoTheta=0.5; isoPhi=0.25;
  isoCamera.position.set(2,1,2.8);
  isoCamera.lookAt(0,0,0);
  // Panel
  document.getElementById('ip-name').textContent=part.name;
  document.getElementById('ip-cat').textContent=part.cat;
  document.getElementById('ip-desc').textContent=part.desc;
  const specDiv=document.getElementById('ip-specs');
  specDiv.innerHTML=part.specs.map(s=>`<div class="ip-spec"><span>${s.k}</span><span>${s.v}</span></div>`).join('');
  document.getElementById('ip-buy').href=part.url;
  document.getElementById('ip-buy').textContent=part.url==='#'?'VIEW IN APP →':'VIEW ON AMAZON →';
  document.getElementById('iso').classList.add('on');
  isoActive=true;
}

function buildFamilyNav(){
  const nav=document.getElementById('famNav');
  nav.innerHTML='';
  Object.keys(FAMILIES).forEach(fk=>{
    const fam=FAMILIES[fk];
    const btn=document.createElement('button');
    btn.className='nb'+(fk===currentFamily?' on':'');
    btn.textContent=fam.name.toUpperCase();
    btn.onclick=()=>selectFamily(fk);
    nav.appendChild(btn);
  });
}

function buildLeftPanel(){
  const lp=document.getElementById('lp');
  const fam=FAMILIES[currentFamily];
  lp.innerHTML='';
  fam.years.forEach((yr,i)=>{
    const div=document.createElement('div');
    div.className='lp-fam';
    const yb=document.createElement('button');
    yb.className='yb'+(i===currentYearIdx?' on':'');
    yb.innerHTML=`<span>${yr.y}</span><span class="ybadge ${yr.has3d?'b3d':'bsp'}">${yr.has3d?'3D':'SPEC'}</span>`;
    yb.onclick=()=>{currentYearIdx=i;currentVariantIdx=0;buildLeftPanel();updateVehicleInfo();updateRightPanel();};
    div.appendChild(yb);
    if(i===currentYearIdx){
      yr.variants.forEach((v,vi)=>{
        const vb=document.createElement('button');
        vb.className='vb'+(vi===currentVariantIdx?' on':'');
        vb.textContent=v;
        vb.onclick=()=>{currentVariantIdx=vi;buildLeftPanel();updateVehicleInfo();updateRightPanel();};
        div.appendChild(vb);
      });
    }
    lp.appendChild(div);
  });
}

function selectFamily(fk){
  currentFamily=fk;
  currentYearIdx=0;
  currentVariantIdx=0;
  document.querySelectorAll('.nb').forEach(b=>b.classList.remove('on'));
  document.querySelectorAll('.nb').forEach(b=>{if(b.textContent===FAMILIES[fk].name.toUpperCase()) b.classList.add('on');});
  buildLeftPanel();
  buildCar(fk);
  updateVehicleInfo();
  updateRightPanel();
  // Show/hide Demon Mode button
  const yr=FAMILIES[fk].years[currentYearIdx];
  document.getElementById('demonBtn').style.display=(fk==='demon'||yr?.demon)?'':'none';
}

function updateVehicleInfo(){
  const fam=FAMILIES[currentFamily];
  const yr=fam.years[currentYearIdx]||fam.years[0];
  const variant=yr.variants[currentVariantIdx]||yr.variants[0];
  document.getElementById('viName').textContent=`${yr.y} ${fam.name} ${variant.split('SRT ')[1]||variant}`;
  document.getElementById('viSpec').textContent=`${yr.hp} hp · ${yr.tq} lb-ft · ${yr.zero60||fam.zero60}s 0-60 · ${fam.boltPattern}`;
  // Demon btn
  const isDemonFam=currentFamily==='demon'||yr?.demonMode;
  document.getElementById('demonBtn').style.display=isDemonFam?'':'none';
  updateMyBuildSpec();
}

function updateMyBuildSpec(){
  const fam=FAMILIES[currentFamily];
  const yr=fam.years[currentYearIdx]||fam.years[0];
  const hp=isDemonMode?(yr.hp==='840'?840:yr.hp):yr.hp;
  const spec=document.getElementById('myBuildSpec');
  if(spec) spec.textContent=`${yr.y} ${fam.name} · ${hp}hp · ${yr.w||fam.weight}lbs`;
}

function calcET(hp,weight,tireBns,launchBns){
  const bsp=weight/hp;
  const base=14.2-(14.2-5.5)*Math.min(1,1/Math.pow(bsp/4.5,0.8));
  return Math.max(5.5,Math.min(18,base-tireBns-launchBns));
}

function runRace(){
  const fam=FAMILIES[currentFamily];
  const yr=fam.years[currentYearIdx]||fam.years[0];
  const hp=isDemonMode?yr.hp:(yr.hp||707);
  const wt=yr.w||fam.weight;
  const tireBns=parseFloat(document.getElementById('dragTires')?.value||0);
  const launchBns=parseFloat(document.getElementById('dragLaunch')?.value||0);
  const oppKey=document.getElementById('oppSelect')?.value||'camaro_ss';
  const opp=OPPONENTS[oppKey];
  const myET=calcET(hp,wt,tireBns,launchBns);
  const oppET=calcET(opp.hp,opp.weight,0,0);
  const myTrap=Math.round(50+(hp/wt)*65);
  const oppTrap=Math.round(50+(opp.hp/opp.weight)*65);
  const box=document.getElementById('trackBox');
  box.style.display='block';
  // Animate
  setTimeout(()=>{
    document.getElementById('myCar').style.left='84%';
    document.getElementById('oppCar').style.left=(myET<oppET?'80%':'86%');
  },50);
  setTimeout(()=>{
    const win=myET<=oppET;
    document.getElementById('raceResult').innerHTML=`
<div style="font-family:var(--fh);font-size:1.5rem;font-weight:700;color:${win?'#4ade80':'#f87171'};margin-bottom:8px">${win?'🏆 WIN':'❌ LOSS'}</div>
<div style="display:grid;grid-template-columns:1fr 1fr;gap:8px;font-family:var(--fm);font-size:.72rem">
<div style="background:var(--bg3);padding:8px;border-radius:3px;border:1px solid ${win?'rgba(74,222,128,.3)':'var(--border)'}">
<div style="color:var(--dim2);margin-bottom:2px">MY BUILD</div>
<div style="color:var(--amber);font-size:1.1rem;font-weight:700">${myET.toFixed(2)}s</div>
<div style="color:var(--dim)">@${myTrap} mph</div>
</div>
<div style="background:var(--bg3);padding:8px;border-radius:3px;border:1px solid ${!win?'rgba(74,222,128,.3)':'var(--border)'}">
<div style="color:var(--dim2);margin-bottom:2px">${opp.name}</div>
<div style="color:var(--white);font-size:1.1rem;font-weight:700">${oppET.toFixed(2)}s</div>
<div style="color:var(--dim)">@${oppTrap} mph</div>
</div>
</div>`;
  },2600);
}

// Load build from URL hash
function loadFromUrl(){
  const p=new URLSearchParams(window.location.search);
  const b=p.get('build');
  if(!b) return;
  try{
    const config=JSON.parse(atob(b));
    currentFamily=config.family||'challenger';
    currentYearIdx=config.year?FAMILIES[currentFamily].years.findIndex(y=>y.y===config.year):0;
    if(currentYearIdx<0) currentYearIdx=0;
    currentVariantIdx=config.variant||0;
    if(config.color) currentColor={hex:config.color,name:'Custom'};
    if(config.parts) Object.assign(activeParts,config.parts);
    if(config.height) heightDrop=config.height;
    isWidebody=config.widebody||false;
    isDemonMode=config.demonMode||false;
    enterApp();
  } catch(e){}
}

});

const HOTSPOT_POSITIONS = {

  supercharger:  {x:0.5,  y:0.36, label:'Supercharger'},
  headers:       {x:0.41, y:0.40, label:'Headers'},

function buildHotspotOverlay(){
  const vw = document.getElementById('vw');
  // Remove existing overlay if any
  const existing = document.getElementById('hotspot-layer');
  if(existing) existing.remove();

  if(!isXray) return; // Hotspots only in X-Ray mode

  const overlay = document.createElement('div');
  overlay.id = 'hotspot-layer';
  overlay.style.cssText = 'position:absolute;inset:0;pointer-events:none;z-index:20';
  vw.appendChild(overlay);

  XRAY_PARTS.forEach(part => {
    const pos = HOTSPOT_POSITIONS[part.id];
    if(!pos) return;

    const dot = document.createElement('div');
    dot.style.cssText = `
      position:absolute;
      left:${pos.x*100}%;
      top:${pos.y*100}%;
      transform:translate(-50%,-50%);
      pointer-events:auto;
      cursor:pointer;
      z-index:21;
    `;
    dot.innerHTML = `
      <div style="position:relative">
        <div class="hs-pulse" style="position:absolute;width:20px;height:20px;border-radius:50%;background:rgba(242,169,0,0.2);top:-5px;left:-5px;animation:hsPulse 2s ease-in-out infinite"></div>
        <div style="width:10px;height:10px;border-radius:50%;background:var(--amber);border:2px solid rgba(10,10,12,0.8);box-shadow:0 0 8px rgba(242,169,0,0.8);transition:transform 0.15s,box-shadow 0.15s" class="hs-dot"></div>
        <div style="position:absolute;bottom:calc(100% + 8px);left:50%;transform:translateX(-50%);background:rgba(10,10,12,0.92);border:1px solid var(--amber);color:var(--amber);font-family:var(--fm);font-size:0.6rem;letter-spacing:0.1em;padding:3px 8px;border-radius:2px;white-space:nowrap;opacity:0;transition:opacity 0.2s;pointer-events:none" class="hs-label">${pos.label}</div>
      </div>`;
    dot.querySelector('.hs-dot').addEventListener('mouseenter', ()=>{
      dot.querySelector('.hs-label').style.opacity='1';
      dot.querySelector('.hs-dot').style.transform='scale(1.4)';
      dot.querySelector('.hs-dot').style.boxShadow='0 0 16px rgba(242,169,0,1)';
    });
    dot.querySelector('.hs-dot').addEventListener('mouseleave', ()=>{
      dot.querySelector('.hs-label').style.opacity='0';
      dot.querySelector('.hs-dot').style.transform='scale(1)';
      dot.querySelector('.hs-dot').style.boxShadow='0 0 8px rgba(242,169,0,0.8)';
    });
    dot.querySelector('.hs-dot').addEventListener('click', ()=>openIso(part.id));
    overlay.appendChild(dot);
  });
}

    <div style="font-family:var(--fh);font-size:1.5rem;font-weight:700;color:var(--white);margin-bottom:4px">${yr.y} ${fam.label}</div>
    <div style="font-family:var(--fm);font-size:0.75rem;color:var(--amber);margin-bottom:18px">${variant}</div>
    <div style="display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:18px">
      ${[
        {k:'ENGINE',v:'6.2L HEMI V8 Supercharged'},
        {k:'HORSEPOWER',v:`${yr.hp} hp`},
        {k:'TORQUE',v:`${yr.tq} lb-ft`},
        {k:'0–60 MPH',v:`${yr.zero60||fam.zero60}s`},
        {k:'WEIGHT',v:`${yr.w||fam.weight} lbs`},
        {k:'BOLT PATTERN',v:fam.boltPattern},
        {k:'HUB BORE',v:fam.hubBore},
        {k:'QUARTER MILE',v:`${yr.hp>=1000?'sub-9s':yr.hp>=840?'9.65s':yr.hp>=717?'10.9s':'11.2s'}`}
      ].map(r=>`<div style="background:var(--bg3);border:1px solid var(--border);border-radius:3px;padding:8px">
        <div style="font-family:var(--fm);font-size:0.58rem;letter-spacing:0.15em;color:var(--dim2);margin-bottom:3px">${r.k}</div>
        <div style="font-family:var(--fm);font-size:0.78rem;color:var(--white);font-weight:700">${r.v}</div>
      </div>`).join('')}
    </div>
    <div style="font-family:var(--fm);font-size:0.65rem;color:var(--dim2);border-top:1px solid var(--border);padding-top:10px">
      3D model not yet available for this variant · Use the configurator panels to build it out
    </div>`;
  vw.appendChild(card);
}

// Hook into year selection to show/hide spec card
const _origBuildLeftPanel = buildLeftPanel;
function buildLeftPanel(){
  _origBuildLeftPanel();
  const fam = FAMILIES[currentFamily];
  const yr = fam.years[currentYearIdx] || fam.years[0];
  if(!yr.has3d){ setTimeout(showSpecCard, 100); }
  else {
    const ex = document.getElementById('spec-card');
    if(ex) ex.remove();
  }
}

// Demon crate tooltip
function showDemonCrateTooltip(){
  alert('🔥 DEMON CRATE — $1 Factory Option\n\nIncludes:\n• Skinny P185/70R17 front drag tires on 17" steel wheels\n• Mickey Thompson drag radials rear\n• Second key fob (unlocks Demon Mode: 840hp)\n• High-flow air filter (SoCalSuperchargers)\n• Harness bar bracket (bolts into trunk)\n• Floor jack puck\n\nOnly 3,300 built. The $1 option that changed drag racing forever.');
}

// ========= FINAL INIT PATCHES =========
// Patch enterApp to also call updateVehicleInfo for Sketchfab button
const _origEnterApp = enterApp;
function enterApp(){
  document.getElementById('hero').classList.add('out');
  document.getElementById('app').classList.add('vis');
  setTimeout(()=>{
    document.getElementById('hero').style.display='none';
    init();
    buildFamilyNav();
    buildLeftPanel();
    updateVehicleInfo();
    updateRightPanel();
    updateCamera();
  }, 300);
}

</script>
